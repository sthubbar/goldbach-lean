version: "v0.4"

project:
  name: "Records of the least prime in a Goldbach partition up to 10^8"
  description: >-
    A Lean 4 proof, with no unproved steps and no hypothesis, of the part of Table 4 of
    T. Oliveira e Silva, S. Herzog and S. Pardi, Empirical verification of the even Goldbach
    conjecture and computation of prime gaps up to 4 · 10^18, Math. Comp. 83, 2014, pages 2033
    to 2060, with n at most 10^8. For an even number n, p of n is the least prime p such that
    n - p is prime. Table 4 on page 2043 lists the 68 even n from 6 to 3325581707333960528 at
    which p of n reaches a new maximum, with the value p of n. The entry proves that the 28 rows
    with n <= 10^8, from n = 6, p = 3 to n = 60119912, p = 1093, are exact, that each is a record,
    and that no record of p of n with n <= 10^8 is missing, together with the existence of a
    Goldbach partition of every even number from 6 to 10^8. This is a finite check on part of
    the paper's data: the 40 rows above 10^8 and the verification up to 4 · 10^18 are not
    claimed. The proof cuts the even numbers up to 10^8 into 125 windows, each settled by one
    equality of natural numbers that encodes a sieve of Eratosthenes over the odd numbers of
    the window as bit vectors and is evaluated by the kernel, and certifies p of n at each row
    by explicit divisors. Binary Goldbach is open and is not claimed. AI agents wrote the Lean
    code, Claude by Anthropic, as listed in PORTING.md, and it is offered for human audit.
  authors:
    - "Steve Hubbard"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Steve Hubbard"

classification:
  arxiv: ["math.NT"]
  msc2020: ["11P32", "11Y16", "11Y11"]

sources:
  - title: "Empirical verification of the even Goldbach conjecture and computation of prime gaps up to 4 · 10^18"
    authors:
      - "Tomás Oliveira e Silva"
      - "Siegfried Herzog"
      - "Silvio Pardi"
    id: "https://doi.org/10.1090/S0025-5718-2013-02787-1"
    type: "article"
    location: "Mathematics of Computation 83, 2014, pages 2033 to 2060; Table 4 on page 2043, the records of p of n"
    relationship: "formalizes"
    note: >-
      Formalizes the 28 rows of Table 4 with n <= 10^8: each row is exact and a record, and the
      list of records below 10^8 is complete. The 40 rows above 10^8 are not checked. The
      authors have not been contacted about this formalization.
    license: "unknown"
    author_endorsement: "not-contacted"

status:
  scope: >-
    Formalized, with no hypothesis: table4_least, for every row n, p of Table 4 with n <= 10^8,
    minGB n = p and minGB m < p for every even m with 6 <= m < n; table4_complete, for every
    even m with 6 <= m <= 10^8, minGB m and m - minGB m are prime and minGB m is at most the p
    of a row n, p with n <= m. Not formalized: the 40 rows of Table 4 above 10^8; the other
    tables of the paper; the verification of the even Goldbach conjecture up to 4 · 10^18; the
    prime gap results; and binary Goldbach, which remains open.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: ["Claude Opus 5.5 (claude-opus-5-5), Anthropic"]
      framework: "Claude Cowork"
      tool_setup: >-
        Autonomous agents read the paper, wrote the statement from Table 4, compared all 68 rows
        with the version of record, and proved the 28 rows up to 10^8 in the lab in units U-6818
        and U-1385 in October 2026. A packaging agent ported the result to Lean 4 v4.35.0-rc3,
        Mathlib v4.35.0-rc3, recomputed p of n for every even n up to 10^8 in Python, reused the
        odd window checker of this repository's Granville, van de Lune and te Riele 1989 entry,
        which the con-ron kernel can replay, generated the windows and divisor certificates,
        strengthened the statements to show p of n at each row and the existence of every
        partition, and ran the Lean kernel, con-ron and the Comparator. The window checks use
        decide +kernel on equalities of natural numbers; no native_decide.
      cost:
        wall_time: "agent runs in October 2026, and packaging on 2026-11-16"
        spend_usd: "subscription-based"
        hardware: "API-only, cloud sandbox and a desktop workstation"
      prompting_notes: >-
        The agents ran under a standing research brief to formalize published results related to
        Goldbach's problem and the inputs they cite, recording every cited input until proved.
  spend_usd: "subscription-based"
  notes: >-
    Steve Hubbard directed the project and decided what to publish. Claude wrote the statement,
    the checker, the computations and the proofs. No file here contains a placeholder proof
    outside the Challenge file. No human expert has reviewed the mathematics.

fidelity:
  divergences: >-
    Only the rows with n <= 10^8 are checked, 28 of the 68 rows of Table 4. The paper defines
    p of n through Goldbach partitions n = p + q with primes p <= q. minGB n is the least prime p
    with n - p prime, and 0 when there is none; for even n >= 6 the prime 2 never qualifies,
    since n - 2 is even and at least 4, and the least such p is at most n - p, so minGB n is the
    paper's p of n, and table4_complete proves that the partition exists, so the junk value 0
    is never used. A record is read as in the paper: the row n, p means p of n = p and
    p of m < p for every even m with 6 <= m < n. table4 holds all 68 printed rows as data, but
    the theorems use only the rows with n <= 10^8.

review:
  status: "self-assessed"
  reviewers:
    - "Claude Opus 5.5, Anthropic, the packaging agent, not a human"
    - "Claude Opus 5.5, Anthropic, a separate AI statement auditor, not a human"
  notes: >-
    The packaging agent, Claude Opus 5.5 by Anthropic, not a human, checked that the 28 rows of
    table4 with n <= 10^8 are exactly the records of p of n found by an independent Python
    computation, that the 68 rows match the lab's table, which lab unit U-7300 compared with the
    version of record, and that the Challenge states the range up to 10^8 and not the paper's
    range. This is a self check by the agent that packaged the entry, not an independent audit.
    Lean kernel, con-ron and Comparator checks pass. Not reviewed by a human expert or by the
    authors.

alignment:
  namespace: "LeanLab"
  statements:
    - source: "Oliveira e Silva, Herzog and Pardi 2014, Table 4, rows with n <= 10^8: each row is exact and a record"
      lean: "LeanLab.OeSHP2014.table4_least"
      module: "ChallengeOliveiraESilvaHerzogPardi2014"
      status: "proved"
    - source: "Oliveira e Silva, Herzog and Pardi 2014, Table 4, rows with n <= 10^8: no record below 10^8 is missing"
      lean: "LeanLab.OeSHP2014.table4_complete"
      module: "ChallengeOliveiraESilvaHerzogPardi2014"
      status: "proved"

acknowledgements: "Mathlib and the Lean FRO; T. Oliveira e Silva, S. Herzog and S. Pardi for the paper."
