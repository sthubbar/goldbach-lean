    relationship: "background"
    note: >-
      Cited input of the paper. Its Theorem 1, in the form of Lemma 10 of Brüdern and Perelli, is
      the explicit hypothesis Lemma10DQ5 of the compared theorem and is not formalized here.
    license: "unknown"
    author_endorsement: "not-contacted"

status:
  scope: >-
    Formalized with one hypothesis, Lemma 10 of the paper, which is Karacuba 1973 Theorem 1, as
    Lemma10DQ5: Theorem 2 of the paper, theorem2_of_named_dq5. Not formalized: the proof of
    Karacuba's theorem, the paper's Theorem 1 and the lemmas of sections 3 to 7, explicit values
    of kappa and B, and binary Goldbach, which remains open.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: ["Claude Opus 5.5 (claude-opus-5-5), Anthropic"]
      framework: "Claude Cowork"
      tool_setup: >-
        Autonomous agents of the Lean Lab read the paper, wrote the statements from it,
        decomposed the proof of section 8 into leaf lemmas and proved them, and ran lake build;
        the lab build receipt 20261119T0802Z-29270 records the axioms of each theorem. A
        packaging agent ported the files to Lean 4 v4.35.0-rc3, Mathlib v4.35.0-rc3, removed the
        declarations that rest on unproved leaves, and ran the Lean kernel and the Comparator.
        No native_decide.
      cost:
        wall_time: "agent runs over 2026-10-17 to 2026-11-19, and packaging on 2026-11-19"
        spend_usd: "subscription-based"
        hardware: "API-only, cloud sandbox and a desktop workstation"
      prompting_notes: >-
        The agents ran under a standing research brief to formalize published results related to
        Goldbach's problem and the inputs they cite, recording every cited input until proved.
    - method: "agent"
      models: ["GPT-6 Codex, OpenAI"]
      framework: "Codex"
      tool_setup: >-
        A Codex prover agent of the Lean Lab wrote the proof bodies of the 25 leaf lemmas of
        LeanLab/ExceptionalSet/Decomp1539a.lean in lab task 140, with their statements unchanged,
        as the file header says.
  spend_usd: "subscription-based"
  notes: >-
    Steve Hubbard directed the project and decided what to publish. Claude wrote the statement
    files, the decomposition of section 8 and the conditional assembly; Codex by OpenAI wrote the
    leaf proofs of Decomp1539a, see PORTING.md. No file here contains a placeholder proof outside
    the Challenge file. No human expert has reviewed the mathematics.

fidelity:
  divergences: >-
    The one hypothesis is Lemma10DQ5, Lemma 10 of the paper on pages 370 and 371, Karacuba 1973
    Theorem 1, taken as an explicit hypothesis and never as an axiom: for 0 < delta < 1 and
    0 < Theta < theta < Theta0 < 1 there are B > 0 and c > 0 such that for every integer N >= 1,
    every k and every real function f in Karacuba's class KClass N theta Theta Theta0 delta f k, the
    sum of e of f of n over N < n <= 2N has absolute value at most B N to the power 1 - c / k^2.
    In KClass, k >= 3, f is k times continuously differentiable on an open set containing the
    interval from N to 2N, the k-th derivative over k factorial is at most N to the power
    -Theta0 k there, and a set S of at least delta k indices s between 1 and k - 1 has
    N to the power -theta s <= |the s-th derivative over s factorial| <= N to the power -Theta s on
    that interval. Asking
    for k times continuous differentiability on an open set only shrinks the class, so the
    hypothesis is no stronger than the lemma. In Theorem 2 the implied constant is an explicit
    existential B, and kappa and B depend on gamma, c and C. Two slips of section 8 are repaired
    in the proof and do not change the statement: the lower end of display 56 on page 377 lacks a
    term log 2 / log N that display 53 needs, and the choice C < gamma times 1 - theta on page 377
    must read 1 + C < gamma times 1 - theta. Lemmas 15 and 16 are used on the closed range
    N <= x <= 2N that Lemma 10 needs, as the proof of Lemma 15 on page 376 does, with N >= 10.

review:
  status: "self-assessed"
  reviewers:
