    relationship: "formalizes"
    note: >-
      Formalizes Theorem 2 on page 354 following the paper's proof in section 8, pages 370 to 377,
      through Lemmas 11 to 16. Lemma 10, which the paper takes from Karacuba 1973, is the explicit
