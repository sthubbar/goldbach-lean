  notes: >-
    The packaging agent compared the Challenge with the lab statements of Theorem 2 and of
    Lemma 10 and checked that every definition the compared theorem reaches is restated under its
    own name with the same open lines and local instances. Lean kernel and Comparator checks pass.
    Not reviewed by a human expert or by the authors.

alignment:
