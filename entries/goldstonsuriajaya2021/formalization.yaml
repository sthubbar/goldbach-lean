# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "An exact average Goldbach representation formula, after Goldston and Suriajaya"
  description: >-
    A sorry-free Lean 4 proof, with no hypothesis, of Theorem 1, equation 11, of D. A. Goldston
    and A. I. Suriajaya, On an average Goldbach representation formula of Fujii, Nagoya Math. J.
    250, 2023, 511 to 532, arXiv 2110.14250v2. With psi_2(n) the sum over m + m' = n of
    Lambda(m) Lambda(m'), for every integer N >= 2 the sum over n <= N of psi_2(n) equals
    N^2/2 - 2 times the sum over nontrivial zeros rho of N^{rho+1} divided by rho times rho+1,
    minus 2 log 2pi - 1/2 times N, plus 2 zeta'/zeta at -1, minus the sum over k >= 1 of
    N^{1-2k} divided by k times 2k-1, plus E(N), an exact identity with E(N) the integral of
    equation 12. The zero sum counts zeros with multiplicity. Derived results of this entry, not
    statements of the paper, show that E(N) does not depend on the radius r, that every term is
    real, that the zero sum converges absolutely, and the case N = 2. Binary Goldbach is open
    and is not claimed; this is an average over n. An AI agent wrote the Lean code; the
    statements were checked against the paper by an AI agent and are offered for human audit.
  authors:
    - "Steve Hubbard"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Steve Hubbard"

classification:
  arxiv: ["math.NT"]
  msc2020: ["11P32", "11M26", "11N05"]

sources:
  - title: "On an average Goldbach representation formula of Fujii"
    authors:
      - "D. A. Goldston"
      - "A. I. Suriajaya"
    id: "arXiv:2110.14250"
    type: "article"
    location: "Nagoya Math. J. 250, 2023, pages 511 to 532, doi 10.1017/nmj.2022.44, Theorem 1, equations 11 and 12"
    relationship: "formalizes"
    note: >-
      Formalizes Theorem 1, equation 11, with E(N) defined by equation 12, read in arXiv
      2110.14250v2 and checked 2026-10-21 and 2026-10-22. The paper writes psi_2 for G and states
      the theorem for N >= 2; here N is an integer, as in the paper. Equation 13, the in particular
      form with O(N), is also stated, as gs_theorem1_of_full, and is derived from equation 11. The
      proof follows the paper: orthogonality gives the sum of psi_2 in terms of E(N) and
      psi_1(N), and the explicit formula for psi_1 with the trivial zeros, Davenport chapter 17,
      is proved in the lab code. The venue was confirmed on the Cambridge Core page of the article.
      The authors have not been contacted about this formalization.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "PrimeNumberTheoremAnd"
    authors:
      - "the PrimeNumberTheoremAnd project contributors"
    id: "https://github.com/AlexKontorovich/PrimeNumberTheoremAnd"
    type: "formalization"
    location: "commit c39a751132c88b6e8080b74c74023fd95b3d8be0"
    relationship: "other"
    note: >-
      Sixteen files under LeanLab/PNTPort/StrongPNT, Mellin and residue calculus, bounds for
      zeta, the conjugation symmetry of zeta'/zeta, the zero-free region and the strong prime
      number theorem, are ported from this Apache-2.0 project, written by its contributors, with
      small fixes for Mathlib v4.35.0-rc3, listed in PORTING.md; each file carries a notice.
      Bridge.lean in that folder is lab-written. They are the same files as in the
      Languasco-Zaccagnini 2012 and Heath-Brown 1985 entries of this repository.
    license: "Apache-2.0"
    author_endorsement: "not-contacted"

related_formalizations:
  - id: "https://github.com/sthubbar/goldbach-lean/tree/main/entries/languascozaccagnini2012"
    relationship: "same G and zero sum, contains the form equation 13, conditional on RH"
    note: >-
      The Languasco-Zaccagnini 2012 entry of this repository proves under RH an asymptotic for
      the same sum with error O(N log^3 N). Its proof contains, as gs_theorem1_proved, the in
      particular form equation 13 of Goldston and Suriajaya, with the three lower terms in O(N),
      but not the exact identity equation 11, which is new here. Its lz_zeroSum_summable is the
      summability proved here as zeroSum_summable.
  - id: "https://github.com/sthubbar/goldbach-lean/tree/main/entries/goldstonyang2016"
    relationship: "same G and zero sums, Cesàro weighted average, conditional on RH"
    note: >-
      The Goldston-Yang 2016 entry of this repository proves under RH the Cesàro weighted
      formula with error O(N), from the same lab library.
  - id: "PALOMAR-2026-10-21-000011"
    relationship: "same G, unconditional equivalence with RH"
    note: >-
      The Granville 2007 entry of this repository proves that RH is equivalent to the sum of
      G(n) over n <= N being N^2/2 + O(N^{3/2+eps}). It uses the same definition of G and no zero
      sum.
  - id: "https://github.com/AlexKontorovich/PrimeNumberTheoremAnd"
    relationship: "source of the ported StrongPNT files"
    note: >-
      A search on 2026-10-22 of Mathlib, of PrimeNumberTheoremAnd at commit
      127b50e33f6033e2147921167a117af96d9ba4ea, of google-deepmind/formal-conjectures and of
      the web found no earlier Lean formalization of Theorem 1 of Goldston and Suriajaya or of an
      explicit formula for the sum of psi_2. PrimeNumberTheoremAnd has a Weil type explicit
      formula in IEANTN/Kadiri.lean, for a different purpose, and a numerical Goldbach file.

status:
  scope: >-
    Formalized, with no hypothesis: Goldston-Suriajaya Theorem 1, equation 11, as
    gs_theorem1_full in complex numbers and as gs_theorem1_full_real in real numbers, for every
    integer N >= 2 and every radius 0 < r < 1; and equation 13, gs_theorem1_of_full. Derived
    results of this entry, not statements of the paper: EGS_indep_r, E(N) does not depend on r;
    EGS_im_eq_zero, logDeriv_zeta_neg_one_im and Z1_im_eq_zero, E(N), zeta'/zeta at -1 and the
    zero sum are real; zeroSum_summable, the zero sum converges absolutely; trivSum_bounds, the
    trivial zero sum lies between 0 and pi^2/3; and gs_theorem1_full_at_two, the identity at
    N = 2 and r = 1/2, a non-vacuity check. Not formalized here: the paper's Theorems 2 to 7,
    its Corollary 2 and its lemmas as separate statements. Binary Goldbach remains open.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

