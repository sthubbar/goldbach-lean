        Autonomous agents wrote every lab Lean file, ran lake build, read the paper, and ran
        separate AI subagents as statement auditors; Lean 4 v4.35.0-rc3, Mathlib v4.35.0-rc3.
      cost:
        wall_time: "agent runs over 2026-10-16 to 2026-10-22, many hours in total"
        spend_usd: "subscription-based"
        hardware: "API-only, cloud sandbox and a desktop workstation"
      prompting_notes: >-
        The agents ran under a standing research brief to formalize published Goldbach-related
        papers and the analytic inputs they cite, recording every cited input until proved.
  spend_usd: "subscription-based"
  notes: >-
    Steve Hubbard directed the project and decided what to publish; AI agents wrote all lab Lean
    code and the statements. No human expert has reviewed the mathematics.

fidelity:
  divergences: >-
    Two points of presentation, both raised by the AI statement audit. First, the paper writes
    E(N), and notes that equation 12 holds for any 0 < r < 1; the Lean EGS N r takes the radius
    r as an argument, and gs_theorem1_full holds for every such r. The derived result EGS_indep_r
    proves that EGS N r takes the same value for every 0 < r < 1, so EGS N r is a function of N
    alone, as the notation E(N) presumes. Second, the paper's identity is between real numbers,
    while gs_theorem1_full is stated in complex numbers, where the zero sum Z1 N and the integral
    EGS N r live, with the real left side cast to the complex numbers. The derived results
    EGS_im_eq_zero, logDeriv_zeta_neg_one_im and Z1_im_eq_zero prove that each term is real, the
    last one read off the imaginary part of gs_theorem1_full, and gs_theorem1_full_real states
    the identity in real numbers with the real parts of those three terms. Other choices: the
    sum over n is over n in range N + 1, that is 0 <= n <= N, and G 0 = 0; I(r, alpha) and
    I_N(r, alpha) start at n = 1, as in the paper; the trivial zero sum over k >= 1 is written
    with k + 1 for k >= 0. The sum over zeros, zeroSum, is an unordered tsum over the distinct
    zeros in the open critical strip, each weighted by its multiplicity analyticOrderNatAt;
    zeroSum_summable proves the family summable for every real x > 0, so the tsum is the
    absolutely convergent sum, independent of ordering, and never the junk value 0. In equation
    13, gs_theorem1_of_full, the O(N) is read as one constant K for all integers N >= 2 and all
    0 < r < 1. The compared theorems other than gs_theorem1_full, gs_theorem1_full_real and
    gs_theorem1_of_full are derived results of this entry, not results of the paper.

review:
  status: "self-assessed"
  reviewers:
    - "AI statement auditor: a separate instance of Claude Opus 5.5 (claude-opus-5-5), Anthropic; not a human reviewer"
  notes: >-
    Status is self-assessed: every check below was done by AI agents of the same model that
    wrote the Lean code, so it is not an independent review and not a human expert review. Three
    separate checks were made, the third described at the end. First, the packaging agent built the entry, ran the Lean kernel
    and the Comparator, and the lab build printed the axioms of the headline theorems, propext,
    Classical.choice and Quot.sound only. Second, a distinct AI statement audit, run
    20261021T1603Z-28836: a fresh agent instance, with no part in writing the proof, read the
    paper independently from arXiv 2110.14250v2 and compared gs_theorem1_full with Theorem 1
    equation 11 and equation 12 term by term, checking the definition of psi_2, the range of the
    sum, the main term, the sign and form of the zero sum and its meaning with multiplicity, the
    linear term, the constant 2 zeta'/zeta at -1, the trivial zero sum and its index shift, the
    definitions of E(N), Psi, I and I_N, the range of r, that the hypotheses are satisfiable at
    N = 2, and that no term is defined as a residual of the others. Its verdict was a match with
    two nits, that r is an argument of EGS and that the identity is stated in complex numbers;
    the packaging agent addressed both by adding the derived results EGS_indep_r,
    EGS_im_eq_zero, logDeriv_zeta_neg_one_im, Z1_im_eq_zero and gs_theorem1_full_real, and
    described them in the docstrings and the fidelity section. Those added theorems were not
    reviewed by that first audit; a second fresh AI statement audit, Claude, on 2026-10-22, read the
    paper's Theorem 1, equations 11 to 13, independently and checked every Challenge definition and
    compared theorem including the added ones, verdict a match, and its labelling fixes were applied. No human expert and no author of the source has reviewed
    the entry.

