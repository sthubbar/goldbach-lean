version: "v0.4"

project:
  name: "A lower explicit threshold for Chen's theorem under GRH"
  description: >-
    A Lean 4 proof that, under the Generalized Riemann Hypothesis, every even
    integer N at least exp(exp 13.375) is the sum of a prime and a square-free number greater
    than 1 with at most two prime factors, conditional on four cited results taken as explicit
    hypotheses of the theorem, never as axioms: Thm5J, Thm6J and Thm7J, the Lean Lab's
    transcriptions of Theorems 5, 6 and 7 of M. Bordignon and V. Starichkova, An explicit
    version of Chen's theorem assuming the Generalized Riemann Hypothesis, Ramanujan J. 64,
    2024, 1213 to 1242; and LinearSieveT4 1/8349 112 114, the transcription of their
    Theorem 4, the explicit linear sieve of Bordignon, Johnston and Starichkova with the
    Table 1 row epsilon inverse 6100, C1 = 112, C2 = 114. These transcriptions use the Lean
    normalisation U_N = 2 e^{-gamma} times the product over p > 2 of 1 - 1/(p-1)^2 times the
    product over p > 2 dividing N of (p-1)/(p-2), while the journal prints U_N without the
    factor 2; see the fidelity section. GRH for Dirichlet L-functions is the premise inside the
    conclusion ChenThreshold13375. The journal's own Corollary 1 has the threshold
    exp(exp 14); the threshold exp(exp 13.375) comes from re-choosing the Section 5.4
    parameters inside the authors' method, alpha = 0.00256, A = 10, u = 1500,
    epsilon = 1/8349, epsilon1 = 10^-20. The numeric inputs are PROVED here: epsilon(1500) is
    below 1/8349 by a kernel certificate, decide +kernel in eleven window modules, and the
    Section 5.4 bracket combination is at least the main-term constant minus 10^-5, a
    one-sided lower bound. Chen's
    weighted inequality, the journal's Lemma 9, is PROVED unconditionally. Binary Goldbach is
    open and is not claimed. An AI agent, Claude, wrote all the Lean code; the statements were
    checked against the paper by AI agents and are offered for human audit.
  authors:
    - "Steve Hubbard"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Steve Hubbard"

