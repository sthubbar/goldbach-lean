fidelity:
  divergences: >-
    The result is conditional. GRH is LeanLab.DERZ1997.GRH: every zero of every Dirichlet
    L-function, for every modulus q at least 1, primitive or not, in the open strip
    0 < Re s < 1 has real part 1/2; it is the premise inside ChenThreshold13375. Four cited
    inputs are explicit hypotheses of the headline theorem, never axioms. Thm5J, Thm6J and
    Thm7J transcribe the journal's Theorems 5, 6 and 7 with all their parameters universally
    quantified, each with GRH, LinearSieveT4 epsilon C1 C2, epsilon(u) at most epsilon and
    0 < epsilon < 1/63 as premises, the range Theorem 4 of the paper requires, and with
    Even n as a premise, as the paper assumes N even throughout Section 5 (see review notes);
    the brackets B5J, B6J and B7J are the printed brackets, with q_G of Lemma 3,
    p_G and c_G of Lemmas 12 and 13, M_phi of Lemma 5, M_phi0 of Lemma 8 and mbar of display
    31. LinearSieveT4 transcribes Theorem 4 only in the ranges the paper uses, F(s) = 2e^gamma/s
    for 1 <= s <= 3 and f(s) = 2e^gamma log(s-1)/s for 2 <= s <= 4, for finitely supported
    nonnegative weights, multiplicative densities g_n and an exceptional finite set Q, with
    non-strict inequalities in place of the printed strict ones. Normalisation: the journal
    prints U_N = e^{-gamma} times the product over p > 2 of 1 - 1/(p-1)^2 times the product
    over p > 2 dividing N of (p-1)/(p-2), pp. 1214 and 1227, without a factor 2, while
    Mertens' theorem gives V(x) = product over p < x, p not dividing N, of 1 - 1/(p-1)
    asymptotic to 2e^{-gamma} C2 Pi_N / log x. The journal's Lemma 10, p. 1227, states
    V(x) = (U_N / log x)(1 + O(...)) with the printed U_N, which by Mertens' theorem holds only
    with the factor 2. The Lean U_N, UNfull = ChenExplicit.U, is 2e^{-gamma} C2 Pi_N, the
    normalisation in which Lemma 10 is correct, and Thm5J, Thm6J and Thm7J are stated with it;
    this differs from the printed definition by a factor 2, so their main terms are twice the
    printed ones, while the printed factor (e^{-gamma} C2)^{-1} in their negligible error terms
    is kept as printed.
    The threshold is stated for natural N, even, with exp(exp 13.375) <= N, and the
    conclusion N = p + m with p prime, m > 1, m square-free and Omega(m) <= 2. epsJ is display
    6 with the sum over primes p >= u0 as a tsum of a summable nonnegative family. The Lean code
    was written by AI. Binary Goldbach is open.

review:
  status: "self-assessed"
  reviewers:
    - "AI packaging agent: an instance of Claude Opus 5.5, claude-opus-5-5, Anthropic; not a human reviewer"
  notes: >-
    Status is self-assessed: every check was done by AI agents of the same model that wrote
    the Lean code, so it is not an independent review and not a human expert review. The
    packaging agent built the entry, ran the Lean kernel and the Comparator, and printed the
    axioms of every compared theorem. A first AI statement audit against the journal, on
    2026-10-27, found GRH, ChenSqfreeRep, ChenThreshold13375, epsJ, Lemma9J, the brackets
    B5J, B6J, B7J and conditions (19), (21), (25) match the paper; the U_N factor 2 and the
    restricted, non-strict LinearSieveT4 are disclosed variants, and the Table 1 row 6100 is
    admissible at epsilon = 1/8349. FIRST VACUITY: LinearSieveT4 has 0 < eps < 1/63 as
    internal premises, so it held for every C1, C2 at eps = 1, and Thm5J then implied not
    GRH, checked in Lean. FIX: Thm5J, Thm6J and Thm7J now take 0 < eps and eps < 1/63 as
    premises, as Theorem 4 of the paper does. A second AI audit on 2026-10-28 found a SECOND
    VACUITY: Thm5J did not assume N even; for odd n, 2 is a sifting prime and every N - p
    with p odd is even, so S(A, P, z) <= 1 while the bound is huge, and Thm5J with
    LinearSieveT4 1/8349 112 114 implied not GRH, checked in Lean. FIX: Thm5J, Thm6J and
    Thm7J now take Even n as a premise, as the paper assumes N even throughout Section 5. A
    third, independent AI vacuity and faithfulness audit on 2026-10-28 re-ran both old
    refutation files against the current entry: neither typechecks (the epsilon premises
    and the Even n premise block them). It then checked every universally quantified
    parameter: alpha near 0 or near its upper limit, A below 2, 3 or 4 (the error terms
    then grow with N, which only weakens the bounds), u, X2, epsilon1, epsilon and C1, C2
    (LinearSieveT4 applied to the single element 1 with g = 0 forces f(s) - eps C2 e^2 h(s)
    <= 1 and F(s) + eps C1 e^2 h(s) >= 1, so small or negative C give no escape), the sets
    SA, SAq, SB, Qset, Bset against the journal's A, A_q, B with z = N^(1/8), y = N^(1/3),
    and the junk-value risks: twinC is proved multipliable with bounds 0.65 to 0.6614, liPV
    is proved to converge for x > 1, the log inside mbar has argument at least 400 under
    (25), and every bracket factor is positive in range. Under GRH the sieve upper bounds
    of Theorems 6 and 7 exceed the expected counts by factors about 2.4 and 2.7, and
    Theorem 5's lower bound is below the expected count, so no further refutation was
    found. Verdict: no remaining vacuity found; the headline is a genuine conditional
    result. No human expert and no author of the journal paper has reviewed the entry.

