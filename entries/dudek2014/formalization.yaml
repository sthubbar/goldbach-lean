version: "v0.4"

project:
  name: "On the Riemann hypothesis and the difference between primes"
  description: >-
    A Lean 4 proof of Theorems 1, 2 and 3 of A. W. Dudek, On the Riemann hypothesis and the
    difference between primes, Int. J. Number Theory 11, 2015, arXiv 1402.6417. Each theorem is
    conditional on the Riemann hypothesis, the paper's own hypothesis, stated with Mathlib's
    RiemannHypothesis. Theorem 2: for every real x at least 2 there is a prime in the interval
    from x - (4/pi) sqrt(x) log x to x. Theorem 1: there is c > 0 such that the interval from x
    to x + c sqrt(x) log x holds more than sqrt(x) primes for every real x at least 2. Theorem
    3: for every epsilon > 0 and all large x there is a prime in the interval from
    x - (1 + epsilon) sqrt(x) log x to x. Each theorem also takes one cited input as an explicit
    hypothesis, never as an axiom: HSWN70 gZ, the zero count of Hasanalizade, Shen and Wong,
    arXiv 2107.06506, Corollary 1.2, for T at least 70, stated for gZ, the ordinates of the
    nontrivial zeros of the Riemann zeta function counted with multiplicity. The paper cites
    the zero count of Trudgian 2014 at this point, whose constant Hasanalizade, Shen and Wong
    report to be in error; the corrected count is used instead. The bounds of Schoenfeld 1976
    for psi - theta, which the paper also cites, are not an input here: the needed estimate is
    proved. Dudek's Lemma 4 and the explicit formula for psi_1 are proved as well. An AI agent,
    Claude, wrote the Lean code, with the ported PrimeNumberTheoremAnd files credited to their
    authors in PORTING.md; the statements were checked against the paper by AI agents and are
    offered for human audit.
  authors:
    - "Steve Hubbard"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Steve Hubbard"

