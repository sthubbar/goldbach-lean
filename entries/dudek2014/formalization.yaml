        Autonomous agents wrote the lab-written Lean files, ran lake build, read the papers and
        wrote the statements from them; small kernel checks use decide +kernel, no
        native_decide; Lean 4 v4.35.0-rc3, Mathlib v4.35.0-rc3.
      cost:
        wall_time: "agent runs over 2026-10-16 to 2026-11-01, many hours in total"
        spend_usd: "subscription-based"
        hardware: "API-only, cloud sandbox and a desktop workstation"
      prompting_notes: >-
        The agents ran under a standing research brief to formalize published papers on primes
        in short intervals and the analytic inputs they cite, recording every cited input until
        proved.
  spend_usd: "subscription-based"
  notes: >-
    Steve Hubbard directed the project and decided what to publish; an AI agent, Claude, wrote
    the lab Lean code and the statements; the files under LeanLab/PNTPort/StrongPNT/ are ported
    from PrimeNumberTheoremAnd and credited to its contributors. No file here contains a
    placeholder proof outside the Challenge file. No human expert has reviewed the mathematics.

fidelity:
  divergences: >-
    Each theorem is conditional. RH is Mathlib's RiemannHypothesis, taken as the hypothesis
    hRH. The cited input HSWN70 gZ is the hypothesis hN, never an axiom. gZ is the family of
    imaginary parts of the zeros of riemannZeta with real part at least -1/2, which are the
    nontrivial zeros, indexed with multiplicity analyticOrderNatAt. HSWN70 gZ states
    Hasanalizade-Shen-Wong Corollary 1.2, |N(T) - (T/2pi) log(T/(2pi e))| at most
    0.1038 log T + 0.2573 log log T + 9.3675, with the 7/8 moved into the error, so 10.2425, as
    counts of ordinates of both signs over any finite set, at most 2(M(T) + R(T)) for T at least
    70 and at most 2((M(t) + R(t)) - (M(T) - R(T))) for T at most t. The paper uses Trudgian
    2014 here, whose constant is reported to be in error, and Schoenfeld 1976 for psi - theta;
    the Schoenfeld input is proved in the entry. Theorem 1 is stated with the counting function
    primesIn x h, the number of primes p with x < p at most x + h, and the strict inequality
    sqrt(x) < primesIn x (c sqrt(x) log x) for every real x at least 2; the proof gives
    c = 10^8, and the paper only asserts existence of c; its remark that c = 3 + epsilon works
    for large x is not formalized. Corollary 1.2 is printed for T at least e and is used here
    only for T at least 70, with N(T) counted with multiplicity as usual. Theorem 2 uses the half open interval
    x - (4/pi) sqrt(x) log x < p at most x for every real x at least 2. Theorem 3 says that for
    every epsilon > 0 there is X with a prime in x - (1 + epsilon) sqrt(x) log x < p at most x
    for all real x at least X. The Lean code was written by AI.

review:
  status: "self-assessed"
  reviewers:
    - "AI packaging agent: an instance of Claude Opus 5.5, claude-opus-5-5, Anthropic; not a human reviewer"
  notes: >-
    Status is self-assessed: every check was done by AI agents of the same model that wrote
    the Lean code, so it is not an independent review and not a human expert review. The
    packaging agent built the entry, ran the Lean kernel and the Comparator, and checked that
    the axioms of the compared theorems are propext, Quot.sound and Classical.choice. HSWN70 gZ
    follows from Hasanalizade-Shen-Wong Corollary 1.2 for T at least e, with the 7/8 moved into
    the error, and two-sided counts equal 2 N(T), so the hypothesis holds for the actual zeros
    and the theorems are not vacuous. No human expert and not the paper's author has reviewed
    the entry.

alignment:
  namespace: "LeanLab"
  statements:
    - source: "Dudek 2015, Theorem 2: under RH, a prime in (x - (4/pi) sqrt(x) log x, x] for every x >= 2"
      lean: "LeanLab.PNTPort.ExplicitPsi1.Trivial.theorem2_of_RH_hsw"
      module: "ChallengeDudek2014"
      status: "proved"
    - source: "Dudek 2015, Theorem 1: under RH, there is c > 0 with pi(x + c sqrt(x) log x) - pi(x) > sqrt(x) for x >= 2"
      lean: "LeanLab.Dudek2014.Theorem1H.theorem1_of_RH_hsw"
      module: "ChallengeDudek2014"
      status: "proved"
    - source: "Dudek 2015, Theorem 3: under RH, for every epsilon > 0, a prime in (x - (1 + epsilon) sqrt(x) log x, x] for all large x"
      lean: "LeanLab.Dudek2014.AbstractC3.theorem3_of_RH_hsw"
      module: "ChallengeDudek2014"
      status: "proved"

