status:
  scope: >-
    Formalized: Theorems 1, 2 and 3 of the paper, theorem1_of_RH_hsw, theorem2_of_RH_hsw and
    theorem3_of_RH_hsw, each under RH and with HSWN70 gZ as an explicit hypothesis. Proved
    along the way: Dudek's Lemma 4, the explicit formula for psi_1 with its error bound, the
    bound for the zero sum on page 5, the prime power window that replaces Schoenfeld's
    psi - theta bounds, and a kernel checked scan of prime gaps up to 67000 for the small range
    of Theorem 2. Not formalized: the zero count of Hasanalizade, Shen and Wong.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

