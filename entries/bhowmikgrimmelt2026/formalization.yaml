# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "The exceptional set of the Goldbach problem"
  description: >-
    A Lean 4 proof, with no unproved steps, of Theorem 3.1 of G. Bhowmik and L. Grimmelt, The
    exceptional set of the Goldbach problem, arXiv 2607.27282 v2, 2026, page 9, a result the
    paper attributes to Hardy and Littlewood. Let E of X be the number of even integers up to X
    that are not a sum of two primes. The theorem is conditional on two hypotheses, Theta < 3/4
    and the zero bound at Theta: every zero of every Dirichlet L-function, for every modulus and
    every character, primitive or not, has real part at most Theta, stated for the zeros in the
    open strip 0 < Re s < 1 of Mathlib's DirichletCharacter.LFunction. Under them, for every
    epsilon > 0 there is a constant C with E of X at most C times X to the power
    2 Theta - 1/2 + epsilon for every X >= 1. The zero bound is unproved for every Theta below 1
    and false for every Theta below 1/2, since the Riemann zeta function has zeros on the
    critical line; the generalized Riemann hypothesis gives it at Theta = 1/2, and then the bound
    X to the power 1/2 + epsilon. No cited input enters: the explicit formula for psi of x and
    chi with a primitive character, Davenport chapter 19, the Gallagher type mean square
    estimates of the major and minor arcs and the zero expansion are all proved in the entry.
    Binary Goldbach is open and is not claimed. Claude and Codex agents wrote the Lean code, with ported
    PrimeNumberTheoremAnd files and two other ported files credited to their authors in
    PORTING.md; it is offered for human audit.
  authors:
    - "Steve Hubbard"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Steve Hubbard"

classification:
  arxiv: ["math.NT"]
  msc2020: ["11P32", "11M26", "11P55"]

