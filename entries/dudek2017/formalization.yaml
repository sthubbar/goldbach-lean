# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "On the sum of a prime and a square-free number"
  description: >-
    Conditional on one explicit hypothesis, AP12Lower 0.21, taken as a hypothesis of the theorem
    and never as an axiom: for every integer x >= 10^9, each reduced residue class mod 12 holds
    more than 0.21 x / log x primes p <= x. Under it, a complete Lean 4 proof of Theorem 1 of
    A. W. Dudek, On the sum of a prime and a square-free number, The Ramanujan Journal 42, 2017:
    every integer N > 2 is the sum of a prime and a square-free number. AP12Lower 0.21 is implied
    by Corollary 1.6 of M. A. Bennett, G. Martin, K. O'Bryant and A. Rechnitzer, Explicit bounds
    for primes in arithmetic progressions, Illinois J. Math. 62, 2018, which gives 1/4 in place of
    0.21; the entry proves that implication in Lean, with the corollary itself stated as a
    hypothesis. The even case, every even N >= 4, is proved with no hypothesis. Binary Goldbach
    is open and is not claimed. The Lean code was written by an AI agent and is offered for
    human audit.
  authors:
    - "Steve Hubbard"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Steve Hubbard"

classification:
  arxiv: ["math.NT"]
  msc2020: ["11P32", "11N36", "11N13", "11Y16"]

sources:
  - title: "On the sum of a prime and a square-free number"
    authors:
      - "Adrian W. Dudek"
    id: "doi:10.1007/s11139-015-9736-2"
    type: "article"
    location: "The Ramanujan Journal 42, issue 1, 2017, pages 233-240; arXiv 1410.7459; Theorem 1"
    relationship: "formalizes"
    note: >-
      Formalizes Theorem 1, every integer N > 2 is a prime plus a square-free number, under the
      hypothesis AP12Lower 0.21 described under fidelity, and its even case with no hypothesis.
      The Lean proof uses the same kind of counting as the paper, bounding the primes p <= N for
      which some prime r has r^2 dividing N - p, but with the lab's own explicit inputs and a
      kernel check of all N up to 10^9, so it is not a line by line formalization of the paper.
      The author was not contacted.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "Explicit bounds for primes in arithmetic progressions"
    authors:
      - "Michael A. Bennett"
      - "Greg Martin"
      - "Kevin O'Bryant"
      - "Andrew Rechnitzer"
    id: "doi:10.1215/ijm/1552442669"
    type: "article"
    location: "Illinois J. Math. 62, 2018, pages 427-532; arXiv 1802.00085; Corollary 1.6"
    relationship: "background"
    note: >-
      Source of the hypothesis, not formalized. Corollary 1.6 gives, for 1 <= q <= 1200,
      gcd(a, q) = 1 and x >= 50 q^2, x / (phi(q) log x) < pi(x; q, a) < x / (phi(q) log x) times
      1 + 5 / (2 log x). It is stated in Lean at integer x as BMORCor16, and the compared theorem
      ap12Lower_of_bmor proves that it implies AP12Lower 0.21, from its lower half at q = 12,
      where phi(12) = 4. The authors have not been contacted.
    license: "unknown"
    author_endorsement: "not-contacted"

related_formalizations: []

status:
  scope: >-
    Formalized: dudek_all_ap12, every N > 2 is p + (N - p) with p < N prime and N - p
    square-free, conditional on AP12Lower 0.21; dudek_even_split, every even N >= 4 is a prime
    plus a positive square-free number, with no hypothesis; and ap12Lower_of_bmor, BMOR 2018
    Corollary 1.6 implies AP12Lower 0.21. Not formalized: AP12Lower itself and the corollary of
    Bennett, Martin, O'Bryant and Rechnitzer. Binary Goldbach remains open.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: ["Claude Opus 5.5 (claude-opus-5-5), Anthropic"]
      framework: "Claude Cowork"
      tool_setup: >-
        Autonomous agents wrote every lab Lean file, ran lake build and kernel checks, and read
        the paper; Lean 4 v4.35.0-rc3, Mathlib v4.35.0-rc3.
      cost:
        wall_time: "agent runs over 2026-10-18 to 2026-10-29, many hours in total"
        spend_usd: "subscription-based"
        hardware: "API-only, cloud sandbox and a desktop workstation"
      prompting_notes: >-
        The agents ran under a standing research brief to formalize published Goldbach-related
        papers and the analytic inputs they cite, recording every cited input as an explicit
        hypothesis until proved.
  spend_usd: "subscription-based"
  notes: >-
    Steve Hubbard directed the project and decided what to publish; AI agents wrote all lab Lean
    code and the statements. No human expert has reviewed the mathematics.

fidelity:
  divergences: >-
    The compared theorem dudek_all_ap12 states Theorem 1 as: for every N > 2 there is a prime
    p < N with N - p square-free, in Mathlib's Nat.Prime and Squarefree, which is the paper's
    p + m with m >= 1 square-free. It is conditional: AP12Lower 0.21 is a hypothesis of the
    theorem, not an axiom. AP12Lower c says that for every a coprime to 12 and every integer
    x >= 10^9 the primes p <= x with p = a mod 12 number more than c x / log x. It is implied by
    the lower half of Corollary 1.6 of Bennett, Martin, O'Bryant and Rechnitzer 2018 at q = 12,
    which gives x / (4 log x); the compared theorem ap12Lower_of_bmor proves that implication.
    The paper instead uses bounds of Ramare and Rumely for moduli up to 169; the Lean proof does
    not follow the paper line by line. For odd N > 10^9 it takes p in a class a mod 12 with
    a = N + 2 mod 4 and a not 0 or N mod 3, so neither 4 nor 9 divides N - p, bounds the p with
    r^2 dividing N - p for primes 5 <= r <= 17 by a Brun-Titchmarsh bound proved in the lab from
    Montgomery's large sieve, and the larger r by the same sieve and the sum of N / n^2, a total
    below 0.21 N / log N. For even N >= 10^9 it uses the classes N mod r^2 and an explicit
    Chebyshev bound, with no hypothesis. For 3 <= N <= 10^9 the Lean kernel checks 1011 windows by
    decide +kernel on bit vectors, each showing every N in the window is q + m with q among the
    primes up to 53 and m square-free, chained into one statement. No native code evaluation and
    no unproved numerical input is used.

review:
  status: "self-assessed"
  reviewers:
    - "AI packaging agent: an instance of Claude Opus 5.5 (claude-opus-5-5), Anthropic; not a human reviewer"
    - "AI statement auditor: a separate instance of Claude Opus 5.5 (claude-opus-5-5), Anthropic; not a human reviewer"
  notes: >-
    Status is self-assessed: every check below was done by an AI agent of the same model that
    wrote the Lean code, so it is not an independent review and not a human expert review. The
    packaging agent compared the Challenge statement with Theorem 1 of the paper as stated in its
    abstract, every integer greater than two may be written as the sum of a prime and a
    square-free number, and confirmed the title and bibliographic data against arXiv 1410.7459
    and the journal record. It compared AP12Lower and BMORCor16 with Corollary 1.6 of Bennett,
    Martin, O'Bryant and Rechnitzer as the lab states it, and checked that the hypothesis is not
    vacuous in form: BMORCor16 is a published theorem and implies it in Lean. It built the entry,
    checked that no file contains a placeholder proof or native code evaluation, ran the Lean
    kernel and the Comparator, which printed Your solution is okay, and printed the axioms of the
    compared theorems, propext, Classical.choice and Quot.sound only. A separate statement audit
    by another instance of Claude Opus 5.5, also not a human, compared the headline with Theorem 1
    of the paper, AP12Lower and BMORCor16 with Corollary 1.6 of the arXiv text of Bennett, Martin,
    O'Bryant and Rechnitzer, checked the hypothesis for vacuity, and found the statements faithful. No human expert and no author of the sources has reviewed the
    entry.

