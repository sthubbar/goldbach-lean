      module: "ChallengeDudek2017"
      status: "proved"
    - source: "Dudek 2017, Theorem 1, even case, a special case of Theorem 1 with no hypothesis"
      lean: "LeanLab.AlmostPrimes.U1497DudekAll.dudek_even_split"
      module: "ChallengeDudek2017"
      status: "proved"
    - source: "Derived result of this entry: Bennett, Martin, O'Bryant, Rechnitzer 2018, Corollary 1.6 implies AP12Lower 0.21"
      lean: "LeanLab.AlmostPrimes.U1504DudekOdd12.ap12Lower_of_bmor"
      module: "ChallengeDudek2017"
      status: "proved"

