  - id: "PALOMAR-2026-10-21-000005"
    relationship: "earlier entry of this repository sharing most of the Lean library, almost all binary Goldbach"
    note: >-
      The Heath-Brown 1985 entry of this repository proves, among other results, that the even
      numbers that are not a sum of two primes have density zero. That classical statement is the
