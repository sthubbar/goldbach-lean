fidelity:
  divergences: >-
    Theorem 1.2: the paper's hypothesis inf over W, b of delta(A; W, b) > 1/2 is stated as the
    existence of eta > 1/2 with eta <= delta(A; W, b) for every W > 0 and every natural b coprime
    to W, which is equivalent. The density lowerDensityRes is a liminf over N of a ratio of
    counts in [1, N], as in the paper; where the denominator is 0, Lean's division gives 0, which
    happens only for finitely many N since every reduced class contains primes. The class is
    tested by n % W = b % W, so b need not be reduced below W. The conclusion, almost all even
    positive integers are in A + A, is that the number of even n in [1, X] not of the form a + b
    with a, b in A, divided by X, tends to 0. Theorem 1.1: relative lower density above 1 - epsilon
    is written as a constant delta > 1 - epsilon with delta pi(N) <= |A cap [0, N]| for all large
    N, which implies the liminf form; a positive proportion of even integers is written as a
    constant c > 0 with at least c N even n <= N outside A + A for all large N, a lower density
    form. Remark 1.3: the paper says that for its construction delta(A; W, b) = 1/alpha in every
    class and that A + A misses a positive proportion of even integers; remark1_3 proves, for
    every c < 1/2, a set A of primes with class densities above c in every reduced class, in the
    same lower bound form, that misses at least kappa N even n <= N for infinitely many N, an
    upper density form, which is the negation of the conclusion of Theorem 1.2. The constant
    delta may depend on the class, so one application gives an infimum of at least c; since c
    is arbitrary below 1/2, applying it to a larger c gives an infimum above c, which is what
    sharpness of 1/2 in Theorem 1.2 requires. It does not prove the exact value 1/alpha. The
    compared theorem hyp_satisfiable is a derived result of this entry, not a result of the
    paper. The classical consequence of Theorem 1.2 at A = all primes, that almost all even
    numbers are sums of two primes, is proved in the lab file U1506Vacuity as instance_P but is
    not a compared theorem, since it follows at once from alsetriShao_1_2 and hyp_satisfiable
    and is already registered in the Heath-Brown 1985 entry.

review:
  status: "self-assessed"
  reviewers:
    - "AI statement auditor: a separate instance of Claude Opus 5.5 (claude-opus-5-5), Anthropic; not a human reviewer"
  notes: >-
    Status is self-assessed: every check below was done by AI agents of the same model that
    wrote the Lean code, so it is not an independent review and not a human expert review. Two
    separate checks were made. First, the packaging agent built the entry, ran the Lean kernel
    and the Comparator, which printed Your solution is okay, and printed the axioms of every
    compared theorem, propext, Classical.choice and Quot.sound only. Second, a distinct AI
    statement audit, Claude Opus 5.5, on 2026-10-25: a fresh agent instance, with no part in
    writing the proof, read the statements of Theorems 1.1 and 1.2, Remark 1.3 and the
    definitions of relative lower density, in P and in a reduced residue class, independently
    from the arXiv 2405.18576v2 text, and compared every Challenge definition and compared
    theorem with them. It checked that P is the set of primes; that lowerDensityRes is the
    paper's liminf over N of the ratio of counts in [1, N] in the class b mod W, that its values
    lie in [0, 1] so the real liminf is not a junk value, and that a zero denominator occurs for
    only finitely many N in a reduced class; that W ranges over all positive integers and b over
    all residues coprime to W, so every reduced class is tested; that one eta > 1/2 below every
    class density is equivalent to the paper's infimum above 1/2; that almost all even positive
    integers is read as the exceptional count up to X over X tending to 0, with the division by
    X = 0 harmless; that the sets in theorem1_1 and remark1_3 are sets of primes; that the lower
    bound forms of the densities are equivalent to liminf statements; that a positive proportion
    is read in theorem1_1 as a lower density bound, the stronger reading, and in remark1_3 as an
    upper density bound, the negation of almost all; that the class dependent delta in remark1_3
    still gives sharpness, as c is arbitrary below 1/2; that the counts over [0, N] that include
    0 change nothing asymptotically; and that the Challenge definitions are the Solution
    definitions verbatim. It found alsetriShao_1_2 equivalent to Theorem 1.2, theorem1_1 a match
    to Theorem 1.1 under its stronger reading, and remark1_3 equivalent to the sharpness claim of
    Remark 1.3 but weaker than the Remark as written, since it omits the exact value 1/alpha, as
    the fidelity section says. It checked that hyp_satisfiable shows the hypothesis of Theorem
    1.2 can be met and is labelled a derived result of this entry. On its advice the derived
    corollary instance_P, which restates content registered in the Heath-Brown 1985 entry, was
    removed from the compared theorems and the labelling in the docstrings and this file was
    updated. No human expert and no author of the source has reviewed the entry.

