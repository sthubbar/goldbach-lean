      files.
  - id: "https://github.com/AlexKontorovich/PrimeNumberTheoremAnd"
    relationship: "source of the ported StrongPNT and PNTSieve files"
    note: >-
      A search on 2026-10-25 of Mathlib v4.35.0-rc3, of PrimeNumberTheoremAnd at commit
      127b50e33f6033e2147921167a117af96d9ba4ea, of google-deepmind/formal-conjectures at commit
      37f0808b83c56c8cef4ea5816b8329c09b8905a8 and of the web found no earlier Lean formalization
      of any result of Alsetri and Shao 2024, and no Lean formalization of the transference
      principle for dense subsets of the primes.

status:
  scope: >-
    Formalized, with no hypothesis: Alsetri-Shao Theorem 1.2, alsetriShao_1_2; Theorem 1.1,
    theorem1_1; and the sharpness of the constant 1/2 claimed in Remark 1.3, remark1_3. Derived
    result of this entry, not a result of the paper: hyp_satisfiable, the hypothesis of Theorem
    1.2 holds for A = all primes with eta = 3/4, a non-vacuity check. Not formalized here as separate compared statements: the paper's Theorem 2.1 and
    Proposition 3.1, which are proved in the library but not compared, and the exact value 1/alpha
    of the class densities in Remark 1.3. Binary Goldbach remains open.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

