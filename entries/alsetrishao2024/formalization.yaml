# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "A density version of the binary Goldbach problem, after Alsetri and Shao"
  description: >-
    A sorry-free Lean 4 proof, with no cited hypothesis, of Theorem 1.2 of A. Alsetri and X. Shao,
    Density versions of the binary Goldbach problem, arXiv 2405.18576v2, Acta Arith. 218, 2025,
    285 to 295: if A is a set of primes whose relative lower density in every reduced residue
    class b mod W is at least some eta > 1/2, then almost all even positive integers are a sum of
    two primes from A. The entry also proves the paper's Theorem 1.1, that relative density
    1 - epsilon in the primes alone does not suffice, and the sharpness of the constant 1/2
    stated in its Remark 1.3. A derived result of this entry, not a result of the paper, shows
    that the hypothesis of Theorem 1.2 holds for the set of all primes, so the theorem is not
    vacuous. Binary Goldbach is open
    and is not claimed; Theorem 1.2 concerns almost all even numbers. An AI agent wrote the Lean
    code, except the ported PrimeNumberTheoremAnd code credited to its authors; the statements
    were checked against the paper by an AI agent and are offered for human audit.
  authors:
    - "Steve Hubbard"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Steve Hubbard"

classification:
  arxiv: ["math.NT"]
  msc2020: ["11P32", "11B30", "11N13"]

sources:
  - title: "Density versions of the binary Goldbach problem"
    authors:
      - "Ali Alsetri"
      - "Xuancheng Shao"
    id: "arXiv:2405.18576"
    type: "article"
    location: "Acta Arith. 218, no. 3, 2025, pages 285 to 295, doi 10.4064/aa240615-19-9, Theorems 1.1 and 1.2 and Remark 1.3"
    relationship: "formalizes"
    note: >-
      Formalizes Theorem 1.2, read in arXiv 2405.18576v2, checked 2026-10-21 and 2026-10-25, with
      the relative lower density delta of A in b mod W defined as in the paper before Theorem
      1.2. The hypothesis, the infimum over all reduced classes is above 1/2, is written as one
      eta > 1/2 below every class density; almost all even integers is read as the count of
      exceptional even n <= X over X tends to 0. Theorem 1.1 and the sharpness claim of Remark
      1.3 are also formalized, in the forms described under fidelity. The proof of Theorem 1.2
      follows the paper's Sections 3 and 4, the transference principle Proposition 3.1 and the
      W-trick; the two lemmas of Green 2005 the paper cites are proved in the lab code, the
      restriction estimate in the form of a large spectrum bound. The venue was confirmed on the
      journal page of the article. The authors have not been contacted about this formalization.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "PrimeNumberTheoremAnd"
    authors:
      - "the PrimeNumberTheoremAnd project contributors"
      - "Arend Mellendijk"
    id: "https://github.com/AlexKontorovich/PrimeNumberTheoremAnd"
    type: "formalization"
    location: "commit c39a751132c88b6e8080b74c74023fd95b3d8be0"
    relationship: "other"
    note: >-
      Sixteen files under LeanLab/PNTPort/StrongPNT, Mellin and residue calculus, bounds for
      zeta, the zero-free region and the strong prime number theorem, written by the
      PrimeNumberTheoremAnd contributors, and five files under LeanLab/PNTSieve, the Selberg sieve
      and the Brun-Titchmarsh inequality, written by Arend Mellendijk, are ported from this
      Apache-2.0 project with small fixes for Mathlib v4.35.0-rc3, listed in PORTING.md; each
      file carries a notice. Bridge.lean, BrunTitchmarshAP.lean and MertensUpper.lean in those
      folders are lab-written. They are the same files as in the Hardy-Littlewood 1923 entry of
      this repository.
    license: "Apache-2.0"
    author_endorsement: "not-contacted"

