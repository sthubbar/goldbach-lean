version: "v0.4"

project:
  name: "On Goldbach's problem: proof that almost all even positive integers are sums of two primes"
  description: >-
    A Lean 4 proof, with no unproved steps, of the main result of T. Estermann, On Goldbach's
    problem: proof that almost all even positive integers are sums of two primes, Proc. London
    Math. Soc. series 2, volume 44, 1938, pages 307-314. Let Q of n be the number of even
    positive integers less than n that are not sums of two primes. The Introduction on page 307
    states that, as n tends to infinity, Q of n is O of n log^-a n for every positive a; this is
    the compared theorem, LeanLab.Estermann1938.main. The proof is not Estermann's circle method
    text: it bounds Q of n by E of n plus 1, where E of X counts the even 4 <= m <= X that are
    not sums of two primes, and uses the bound E of X << X log^-A X for every A, proved by
    Heath-Brown's 1985 route from the Siegel-Walfisz theorem. That bound is already a compared
    theorem of the registered entry heathbrown1985 of this repository,
    LeanLab.PNTPort.PsiChi.goldbach_logPowerSaving, whose Challenge states the same E of X bound;
    this entry adds Estermann's own count Q of n and his big O form, and the Lean closure is the
    same as that entry's plus one file. Binary Goldbach is open and is not claimed. AI agents,
    Claude by Anthropic, wrote the lab's Lean code; the ported zeta function code is by the
    PrimeNumberTheoremAnd contributors, as listed in PORTING.md. It is offered for human audit.
  authors:
    - "Steve Hubbard"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Steve Hubbard"

classification:
  arxiv: ["math.NT"]
  msc2020: ["11P32", "11P55", "11N13"]

sources:
