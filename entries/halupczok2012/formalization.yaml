fidelity:
  divergences: >-
    The defect: Theorem 1.2 as printed sums over all q <= Q with no condition that a and q are
    coprime, its right side is << Y1 Y2 L^-A with no factor Q, and the printed T(n, q, a) is
    not 0 when a and q have a common prime factor d. For such q <= X1 a prime p1 = a mod q must
    equal d, which is below X1, so the prime sum is empty, while the term T(n, q, a) Y1 Y2
    remains; at a = 3, q = 3 it is about 0.767 Y1 Y2, larger than the claimed bound, so the
    printed statement is false. The proof says it assumes q and a coprime without loss of
    generality. The repair: theorem2Zeroed_U1510 keeps the sum over all q <= Q and replaces T by
    T0, equal to T when gcd(a, q) = 1 and to 0 otherwise, as the paper's binary singular series
    S(r, q, a) in display 1 already is, and adds the hypothesis Q <= X1, which follows from
    Q << Y1 X1^-1/2 L^-B once X1 is at least c6 squared, so it can be absorbed into the
    threshold Y0 and does not weaken the theorem; theorem2_U1510 keeps T and restricts the sum to q coprime
    to a. The lab lemma theorem2Zeroed_of_theorem2 derives the first form from the second, by
    ternSum_noncoprime. Both are
    conditional: PPS1984Remark and PP1993Goldbach are hypotheses of the theorems, not axioms,
    and are described under sources; PP1993Goldbach is not a numbered printed theorem, and
    PPS1984Remark is used in a reading uniform in the interval length. Encoding: every <<, >>
    and asymp sign in a hypothesis is a universally quantified constant, every << in a
    conclusion an existential constant C, sufficiently large an existential threshold Y0, and
    B is existential after A and the epsilons, so it may depend on the epsilons, while the paper
    says B = B(A); C and Y0 may depend on the fixed a and on the constants of the hypotheses. L is
    log Y2, as the proof sets Y = Y2, and log Y1 is comparable to it;
    the hypothesis 1 <= Q only excludes an empty sum. T is written as phi(q)^-1 times a tprod
    over all primes of the printed local factor, which converges absolutely, as the proof
    shows. The maxima over residues in Theorem 2.1 and in the Remark are encoded as arbitrary
    choice functions of q. PPS1984Remark adds y <= x, which only narrows its hypothesis.
    PP1993Goldbach is stated with von Mangoldt weights and the pair count M* as main term, the
    form of R* and M* on p. 43 of Perelli and Pintz, and with H exactly Y^1/3+eps; it is the
    natural general Y form of the Perelli and Pintz argument and is at least as strong as the
    paper's Theorem 2.3, which the entry derives from it. The compared theorems
    theorem3_of_remark and theorem5_of_PP1993 are derived results of this entry, not theorems of
    the paper.

review:
  status: "self-assessed"
  reviewers:
    - "AI statement auditor: a separate instance of Claude Opus 5.5 (claude-opus-5-5), Anthropic; not a human reviewer"
  notes: >-
    Status is self-assessed: every check below was done by AI agents of the same model that
    wrote the Lean code, so it is not an independent review and not a human expert review. Two
    separate checks were made. First, the packaging agent built the entry, ran the Lean kernel
    and the Comparator, which printed Your solution is okay, and printed the axioms of every
    compared theorem, propext, Classical.choice and Quot.sound only. Second, a distinct AI
    statement audit, Claude Opus 5.5, on 2026-10-25: a fresh agent instance, with no part in
    writing the proof, read Theorem 1.2, the notation section and the proof in Section 4 from
    the JTNB pdf and arXiv 1212.4406v1, with page 333 checked as a page image, Theorems 2.1 and
    2.3 on pages 338 and 339, and the Theorem and Remark on page 530 of Perelli, Pintz and
    Salerno 1984 as a page image. It compared Thm2Hyp, ternSum, T, S, T0, Theorem2,
    Theorem2Zeroed, Theorem3, Theorem5, PPS1984Remark and PP1993Goldbach with them. It checked
    the ranges of q and a, the exponents, the windows for p1 and p2, the error term L^-A with L
    equal to log Y2, the order of the quantifiers over A, B, the hypothesis constants, C and
    Y0, and that every power and logarithm has a positive base under the hypotheses. It
    confirmed the defect: the printed T(n, 3, 3) lies between 0.66 and 0.767 for every odd n
    prime to 3, while the prime sum for a = 3, q = 3 is empty
    once X1 exceeds 3, and the proof assumes q and a coprime without loss of generality. It
    found the added hypothesis Q <= X1 implied by the others for large Y0, so harmless. It
    found PPS1984Remark a match to the printed Remark in its reading with one implied constant
    for all y, a reading the Remark's form y >= x^3/5 (log x)^C invites, and judged it
    plausibly true; it found PP1993Goldbach at least as strong as the paper's Theorem 2.3, with
    no junk value that would make it false, and judged it plausibly true, but it could not read
    Perelli and Pintz 1993, which is paywalled, and judged that hypothesis against the paper's
    statement of Theorem 2.3 only. On its advice the two implications were labelled derived
    results of this entry in the docstrings and this file, the lab module holding
    ternSum_noncoprime was renamed NonCoprime with one docstring made neutral, the fidelity
    section was extended, and the author endorsement was set to other with a neutral note. The
    auditor then rebuilt the entry and reran the Comparator, which again printed Your solution
    is okay. No human expert and no author of the sources has reviewed the entry.

