version: "v0.4"

project:
  name: "CONDITIONAL on Perelli-Pintz-Salerno 1984 and Perelli-Pintz 1993: Halupczok's ternary Goldbach mean value theorem with primes in progressions and short intervals, repaired"
  description: >-
    CONDITIONAL on two cited results, both taken as explicit hypotheses of the theorems and never
    as axioms: PPS1984Remark, the printed Remark on p. 530 of A. Perelli, J. Pintz and S.
    Salerno, Bombieri's theorem in short intervals, 1984, and PP1993Goldbach, the Goldbach
    analogue of Theorem 3 of A. Perelli and J. Pintz, On the exceptional set for Goldbach's
    problem in short intervals, 1993, established in its sections 3 to 5 but not printed as a
    numbered theorem. These are the inputs that the paper's own proof quotes as its Theorems 2.1
    and 2.3. PP1993Goldbach is therefore a weaker citation than a numbered theorem: it is the
    unnumbered Goldbach analogue that Halupczok says the proof of Perelli and Pintz can be
    adapted to give, stated here in the general form that argument yields. Under the two hypotheses, a complete Lean 4 proof of a repaired form of Theorem 1.2 of K.
    Halupczok, Goldbach's problem with primes in arithmetic progressions and in short intervals,
    J. Theor. Nombres Bordeaux 25, 2013, 331 to 351: summed over moduli q <= Q, the weighted
    count of p1 + p2 + p3 = n with p1 = a mod q and p1, p2 in short intervals differs from its
    singular series main term T(n, q, a) Y1 Y2 by << Y1 Y2 L^-A. As printed, the theorem sums
    over all q <= Q with the printed T, which does not vanish when a and q have a common factor,
    while the prime sum then is empty, so the printed statement fails, for example at a = 3,
    q = 3. The repair takes the main term to be 0 for such q, or equivalently restricts to q
    coprime to a. The entry also proves that the two hypotheses imply the paper's Theorems 2.1
    and 2.3, as derived results of this entry. Binary Goldbach is open and is not claimed; ternary Goldbach is a theorem of
    Helfgott. An AI agent wrote the Lean code; the statements were checked against the sources
    by an AI agent and are offered for human audit.
  authors:
    - "Steve Hubbard"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Steve Hubbard"

classification:
  arxiv: ["math.NT"]
  msc2020: ["11P32", "11N13", "11P55"]

sources:
  - title: "Goldbach's problem with primes in arithmetic progressions and in short intervals"
    authors:
      - "Karin Halupczok"
    id: "arXiv:1212.4406"
    type: "article"
    location: "J. Theor. Nombres Bordeaux 25, 2013, no. 2, pages 331 to 351, doi 10.5802/jtnb.839, Theorem 1.2, pages 333 to 334, Theorem 2 of the arXiv version; Theorems 2.1 and 2.3, pages 338 and 339"
    relationship: "adapts"
    note: >-
      Adapts Theorem 1.2, read from page images of the open journal pdf on 2026-10-25 and from
      arXiv 1212.4406v1, with the repair described under fidelity. The hypotheses, the ternary
      sum and the main term T are as printed. The proof follows the paper's: the substitution
      through the binary sum, a binary part bounded from its Theorem 2.3 and a main term part
      bounded from its Theorem 2.1 and the singular series computation. The paper's Lemma 1 is
      not needed. The paper's quoted Theorems 2.1 and 2.3 are stated as Theorem3 and Theorem5
      and derived from the two cited results below. The author was informed by email of the
      defect described under fidelity. No endorsement of this formalization by the author is
      claimed.
    license: "unknown"
    author_endorsement: "other"
  - title: "Bombieri's theorem in short intervals"
    authors:
      - "A. Perelli"
      - "J. Pintz"
      - "S. Salerno"
    id: "https://www.numdam.org/item/ASNSP_1984_4_11_4_529_0/"
    type: "article"
    location: "Ann. Scuola Norm. Sup. Pisa Cl. Sci. 4, 11, 1984, no. 4, pages 529 to 539, the Remark on page 530 with display 2 of page 529"
    relationship: "background"
    note: >-
      Cited hypothesis, not formalized: PPS1984Remark is the printed Remark on p. 530, that
      display 2, a Bombieri-Vinogradov bound for psi in intervals of length y with a maximum over
      residues, over h <= y and over x/2 < z <= x, holds for Q <= y x^-1/2 log^-B x whenever
      y >= x^3/5 log^C x with C = C(A). It is read with one implied constant for all such y <= x;
      a reading of the proof on pp. 531 to 538 found that the only dependence on the exponent is
      delta = delta(theta) in display 5, p. 531, from Huxley and Iwaniec 1975, which can be taken
      absolute by a covering at one fixed exponent. That check is an argument by an AI agent,
      not checked in Lean, and Huxley and Iwaniec was not read. The Lean file also states the
      printed fixed exponent Theorem of p. 530 as PPS1984Printed and proves that the uniform
      reading implies it. Halupczok quotes this result as her Theorem 2.1. The authors have not
      been contacted.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "On the exceptional set for Goldbach's problem in short intervals"
    authors:
      - "A. Perelli"
      - "J. Pintz"
    id: "doi:10.1112/jlms/s2-47.1.41"
    type: "article"
    location: "J. London Math. Soc. 2, 47, 1993, pages 41 to 49, sections 3 to 5, displays 1, 3, 4 and 5, pages 43 to 46"
    relationship: "background"
    note: >-
      Cited hypothesis, not formalized: PP1993Goldbach is the mean square bound for R*(2n, N, Y)
      against M*(2n, N, Y) S(2n) over N < 2n <= N + H, H = Y^1/3+eps, N^7/12+eps <= Y <= N,
      with R* and M* as defined on p. 43. The paper does not print it as a numbered theorem: its
      Theorem 3, p. 44, is the analogous result for 2k twin primes, derived from the twin
      analogues of displays 4 and 5 by one sentence, while displays 1 and 3 on p. 44, 4 on p. 45
      and 5 on p. 46 give the Goldbach form. Halupczok cites Theorem 3 and states the result she
      needs as her Theorem 2.3, saying the proof in that reference can be adapted; the entry
      derives her Theorem 2.3 from PP1993Goldbach by an elementary difference of two such sums.
      The printed Theorem 3 is stated in the lab file as PP1993Thm3Printed and not used. The
      authors have not been contacted.
    license: "unknown"
    author_endorsement: "not-contacted"

related_formalizations:
  - id: "https://github.com/sthubbar/goldbach-lean/tree/main/entries/bombierivinogradov1965"
    relationship: "earlier entry of this repository, unconditional Bombieri-Vinogradov over the full range"
    note: >-
      The Bombieri-Vinogradov 1965 entry of this repository proves the classical theorem for psi
      over 1 to x. It does not give intervals of length x^3/5+eps and is not used here; this
      entry shares no Lean file with it. A search on 2026-10-25 of Mathlib v4.35.0-rc3 and of the
      web found no earlier Lean formalization of any result of Halupczok 2012, of Bombieri's
      theorem in short intervals, or of a short interval Goldbach mean square.

