version: "v0.4"

project:
  name: "Wu 2008 Lemma 2.2, Chen's double sieve inequality, with the range of the last sum repaired"
  description: >-
    A Lean 4 proof of the combinatorial inequality (2.2) of J. Wu, Chen's double sieve,
    Goldbach's conjecture and the twin prime problem, 2, Acta Arith. 131 (2008), Lemma 2.2:
    4 D_{1,2} >= 3 Y1 + Y2 - Y3 - Y4 + Y5 + Y6 - 2 Y7 - Y8 - Y9 - Y10 - Y11 - error, where the
    Y_i are Wu's sieve sums over the sequence A = {N - p}. The printed proof drops part of the
    range of the triple sum produced by Buchstab's identity, so the printed Y11, over
    p4 < N^{1/2-2 kappa1}/p3, is not justified; this formalization proves the inequality with the
    full range N^{kappa2} <= p4 < N^{1/2-3 kappa1}, for every N > 1, every pair kappa1, kappa2
    meeting Wu's hypotheses, any finite A of integers 0 < a < N coprime to N, and with Wu's
    O(N^{1-kappa1}) made explicit as 4N/(N^{kappa1}-1) for A = {N - p}. Lean code written by an
    AI agent; the statement was checked against the paper by AI reviewers and is offered for
    human audit.
  authors:
    - "Steve Hubbard"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Steve Hubbard"

classification:
  arxiv: ["math.NT"]
  msc2020: ["11P32", "11N35", "11N36"]

sources:
  - title: "Chen's double sieve, Goldbach's conjecture and the twin prime problem, 2"
    authors:
      - "Jie Wu"
    id: "arXiv:0709.3764"
    type: "article"
    location: "Acta Arithmetica 131 (2008) 367-387, doi:10.4064/aa131-4-5"
    relationship: "adapts"
    note: >-
      Formalizes Lemma 2.2, inequality (2.2), p. 371, with three declared changes: the range of
      Y11 extended to the one the proof's Buchstab step produces; the sieve sets of Y9, Y10, Y11
      read as P(N p1 p2), P(N p1), P(N p1), the sets the proof uses, where the print has P(N p1),
      P(N), P(N) and the sums would vanish; and P(z) read with p < z. The author has not been
      contacted about this formalization.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "Chen's double sieve, Goldbach's conjecture and the twin prime problem"
    authors:
      - "Jie Wu"
    id: "arXiv:0705.1652"
    type: "article"
    location: "Acta Arithmetica 114 (2004) 215-273"
    relationship: "background"
    note: "Source of the switching bounds used in Wu 2008 to evaluate Y9 to Y11; not formalized here."
    license: "unknown"
    author_endorsement: "not-contacted"

related_formalizations: []

status:
  scope: >-
    Formalized: inequality (2.2) of Wu 2008 Lemma 2.2 as an exact inequality between finite
    counts, for every N > 1, with Y11 over the repaired range and an explicit error term,
    lemma22_sum; the same for Wu's sequence A = {N - p : p < N prime, p not dividing N} with the
    error bounded by 4N/(N^{kappa1}-1), lemma22_wuA; and the admissibility of Wu's own
    kappa1 = 1/13.27, kappa2 = 1/8.24, wu_admissible. Not formalized: the analytic evaluation of
    the Y_i by the linear sieve and switching, and so not Wu's constant 0.899 or its corrected
    value; the repaired statement only removes a gap in the combinatorial step.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: ["Claude Opus 5.5 (claude-opus-5-5), Anthropic"]
      framework: "Claude Cowork, Claude Agent SDK"
      tool_setup: >-
        An autonomous agent wrote every Lean file, ran lake build, read the paper on ar5iv and in
        a browser, and ran separate AI subagents as falsifiers and statement auditors; Lean 4
        v4.35.0-rc3, Mathlib v4.35.0-rc3.
      cost:
        wall_time: "about 3 hours of agent time across two sessions on 2026-10-19 and 2026-10-20"
        spend_usd: "subscription-based"
        hardware: "API-only, cloud sandbox"
      prompting_notes: >-
        The agent ran under a standing research brief to formalize published Goldbach-related
        papers, check their constants and proofs, and report gaps; the gap was found while
        proving the printed lemma.
  spend_usd: "subscription-based"
  notes: >-
    Steve Hubbard directed the project and decided what to publish; the AI agent found the gap,
    wrote all Lean code and the statement. Two independent AI subagents compared the statement
    with the paper and with an independent Python implementation, which found 0 failures of the
    repaired pointwise inequality on 3056 random cases and 40 failures with the printed range.
    No human expert has reviewed the mathematics.

fidelity:
  divergences: >-
    Y11 runs over N^{kappa2} <= p4 < N^{1/2-3 kappa1} instead of the printed
    p4 < N^{1/2-2 kappa1}/p3; this is the point of the entry. Y9 sifts by P(N p1 p2) at level
    (N/p1p2)^{1/2}, Y10 and Y11 by P(N p1) at level p2, the intended sets; with the printed sets
    the three sums are identically 0. P(z) is the product of primes p < z, not p <= z.
    Wu's O(N^{1-kappa1}) is replaced by the exact count 4 Esq and, for Wu's A, by 4N/(N^{kappa1}-1).
    The last hypothesis 3 kappa1 - kappa2 < 1/6 is weakened to <=. The inequality is stated for
    all N > 1 rather than for large N. D_{1,2} counts a in A with Omega(a) <= 2.
    A configuration where the printed pointwise form fails, exponents 0.08, 0.09, 0.12, 0.25, is
    proved in the exponent model in the Lean Lab file LeanLab/ChenDoubleSieve/Wu2008Lemma22Gap.lean,
    not part of this entry.

review:
  status: "self-assessed"
  reviewers:
    - "none"
  notes: >-
    Statement audited against the journal and arXiv versions by two separate AI subagents, both
    agreeing on every term; Lean kernel and Comparator checks pass. Not reviewed by a human
    expert or by the author.

alignment:
  namespace: "GoldbachLean.Wu2008"
  statements:
    - source: "Wu 2008, Lemma 2.2, inequality (2.2)"
      lean: "GoldbachLean.Wu2008.WuSum.lemma22_sum"
      module: "ChallengeWu2008"
      status: "adapted"
      note: "Exact form with the repaired Y11 range and explicit error term 4 Esq; see fidelity."
    - source: "Wu 2008, Lemma 2.2, for A = {N - p}"
      lean: "GoldbachLean.Wu2008.WuSum.lemma22_wuA"
      module: "ChallengeWu2008"
      status: "adapted"
      note: "Error bounded explicitly by 4N/(N^{kappa1}-1)."
    - source: "Wu 2008, Lemma 2.2, hypotheses on kappa1, kappa2"
      lean: "GoldbachLean.Wu2008.WuReal.wu_admissible"
      module: "ChallengeWu2008"
      status: "proved"
      note: "Wu's kappa1 = 1/13.27, kappa2 = 1/8.24 satisfy the hypotheses."

