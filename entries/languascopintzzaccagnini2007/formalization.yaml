      lean: "LeanLab.LPZ2007.global_primes_of_three_inputs"
      module: "ChallengeLanguascoPintzZaccagnini2007"
      status: "proved"
    - source: "Languasco, Pintz and Zaccagnini 2007, the Theorem on J of X with coefficient 2 c0 C of k and N, from three cited inputs"
      lean: "LeanLab.LPZ2007.repaired_mainJ131_of_three_inputs"
      module: "ChallengeLanguascoPintzZaccagnini2007"
      status: "proved"
    - source: "Languasco, Pintz and Zaccagnini 2007, Corollary 4.2 on J of X, from three cited inputs"
      lean: "LeanLab.LPZ2007.cor42_of_three_inputs"
      module: "ChallengeLanguascoPintzZaccagnini2007"
      status: "proved"

