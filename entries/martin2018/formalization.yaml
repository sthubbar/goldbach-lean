# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "A misprint in Martin's refined Goldbach conjecture for primes congruent to 1 mod 4"
  description: >-
    A Lean 4 proof, with no unproved steps, that Conjecture 1.2 iv of Kimball Martin, Refined
    Goldbach conjectures with primes in progressions, arXiv 1806.00946 v1, 2018, published in
    Experimental Mathematics 31, 2022, pages 226-232, is false as printed on page 1 of the arXiv
    version. The printed conjecture says that any n congruent to 2 mod 4, except n = 2, 6, 14,
    18, 62, is of the form p + q with primes p and q both congruent to 1 mod 4. The number 38
    is congruent to 2 mod 4 and is not in the printed list, but it is not such a sum: the primes
    below 38 that are 1 mod 4 are 5, 13, 17, 29 and 37, and 38 minus each of them is 33, 25, 21,
    9 or 1, none prime. Also 18 = 5 + 13 is such a sum, so 18 is not an exception. Section 3 of
    the same paper lists the exceptional set E_{1,1,4} = {2, 6, 14, 38, 62}, so 38 was printed
    as 18. The entry proves that the printed conjecture is false, that none of 2, 6, 14, 38 and
    62 is a sum of two primes congruent to 1 mod 4, and that 18 is. The corrected conjecture,
    with exceptions 2, 6, 14, 38, 62, is open and is not proved here; Martin checked Conjecture
    1.2 numerically up to 10^8. The published journal version was not checked for the same
    misprint. The observation is elementary and does not affect the paper's heuristics or data.
    No compared theorem uses any cited input. Binary Goldbach is open and is not claimed. Claude
    by Anthropic, an AI agent, wrote the Lean code, as listed in PORTING.md, and it is offered
    for human audit.
  authors:
    - "Steve Hubbard"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Steve Hubbard"

classification:
  arxiv: ["math.NT"]
  msc2020: ["11P32", "11N13"]

sources:
  - title: "Refined Goldbach conjectures with primes in progressions"
    authors:
      - "Kimball Martin"
    id: "arXiv:1806.00946"
    type: "article"
    location: "arXiv 1806.00946 v1, 4 June 2018, page 1, Conjecture 1.2 iv, and Section 3, the list of exceptional sets; published in Experimental Mathematics 31, 2022, pages 226-232"
    relationship: "formalizes"
    note: >-
      Formalizes Conjecture 1.2 iv as printed and proves it false at n = 38, using the
      exceptional set E_{1,1,4} printed in Section 3 as the correction. The author has not been
      contacted about this formalization or the misprint.
    license: "unknown"
    author_endorsement: "not-contacted"

status:
  scope: >-
    Formalized, with no hypothesis: Conjecture 1.2 iv as printed is false,
    conj1_2_iv_printed_false; none of 2, 6, 14, 38, 62 is a sum of two primes congruent to 1
    mod 4, conj1_2_iv_exceptions; 18 is such a sum, eighteen_is_sum. The last two are derived
    results of the entry that check the paper's corrected exceptional set and the misprinted
    entry. Not formalized: the corrected Conjecture 1.2 iv and every other conjecture of the
    paper, which are open, and binary Goldbach, which remains open.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: ["Claude Opus 5.5 (claude-opus-5-5), Anthropic"]
      framework: "Claude Cowork"
      tool_setup: >-
        Autonomous agents read the paper, wrote the statements from it and wrote the Lean proof
        in lab unit U-0046 on 2026-10-16, and ran lake build; a falsifier agent rechecked the
        failure at 38, and a separate AI subagent checked the statements against Section 1 of
        the paper on 2026-10-18. A packaging agent ported the file to Lean 4 v4.35.0-rc3,
        Mathlib v4.35.0-rc3, replaced the lab's decide proofs by norm_num case checks, compared
        the printed conjecture with page 1 and Section 3 of the arXiv PDF of 1806.00946 v1, and
        ran the Lean kernel and the Comparator. No native_decide and no decide.
      cost:
        wall_time: "agent runs on 2026-10-16 and 2026-10-18, and packaging on 2026-11-16"
        spend_usd: "subscription-based"
        hardware: "API-only, cloud sandbox and a desktop workstation"
      prompting_notes: >-
        The agents ran under a standing research brief to formalize published results related to
        Goldbach's problem and the inputs they cite, recording every cited input until proved.
  spend_usd: "subscription-based"
  notes: >-
    Steve Hubbard directed the project and decided what to publish. Claude wrote the
    statements, the counterexample and the proofs. No file here contains a placeholder proof
    outside the Challenge file. No human expert has reviewed the mathematics.

fidelity:
  divergences: >-
    Of the form p + q with p and q satisfying the congruence conditions is read as: there are
    primes p and q with p mod 4 = 1, q mod 4 = 1 and p + q = n, ordered and not necessarily
    distinct. Any positive even n congruent to 2 mod 4 is read as every natural number n with
    n mod 4 = 2, which is then positive and even. The printed list of exceptions 2, 6, 14, 18,
    62 is kept exactly. No constant or range of the paper is changed.

review:
  status: "self-assessed"
  reviewers:
    - "Claude Opus 5.5, Anthropic, an AI statement auditor in the lab, not a human"
    - "Claude Opus 5.5, Anthropic, a separate AI statement auditor, not a human"
    - "Claude Opus 5.5, Anthropic, the packaging agent, not a human"
  notes: >-
    In the lab a fresh AI subagent, Claude Opus 5.5 by Anthropic, not a human, read Section 1
    of arXiv 1806.00946 and checked each definition against it, including the printed list of
    Conjecture 1.2 iv, and confirmed the misprint against the exceptional set E_{1,1,4} of
    Section 3. The packaging agent, Claude Opus 5.5 by Anthropic, not a human, compared the
    Challenge with page 1 and Section 3 of the arXiv PDF of 1806.00946 v1; this is a self check
    by the agent that packaged the entry, not an independent audit. Lean kernel and Comparator
    checks pass. Not reviewed by a human expert or by the author.

alignment:
  namespace: "LeanLab"
  statements:
    - source: "Martin 2018, Conjecture 1.2 iv as printed on page 1 is false"
      lean: "LeanLab.Martin2018.conj1_2_iv_printed_false"
      module: "ChallengeMartin2018"
      status: "proved"
    - source: "Martin 2018, Section 3, E_{1,1,4} = {2, 6, 14, 38, 62}: no listed number is a sum of two primes congruent to 1 mod 4, derived result of the entry"
      lean: "LeanLab.Martin2018.conj1_2_iv_exceptions"
      module: "ChallengeMartin2018"
      status: "proved"
    - source: "Martin 2018, Conjecture 1.2 iv, 18 = 5 + 13 is a sum of two primes congruent to 1 mod 4, derived result of the entry"
      lean: "LeanLab.Martin2018.eighteen_is_sum"
      module: "ChallengeMartin2018"
      status: "proved"

acknowledgements: "Mathlib and the Lean FRO; Kimball Martin for the paper."
