# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Short effective intervals containing primes"
  description: >-
    A Lean 4 proof of conditional forms of Theorem 1.1 and Corollary 1.2 of H. Kadiri and
    A. Lumley, Short effective intervals containing primes, Integers 14, 2014, A61, arXiv
    1407.7902. Theorem 1.1 says that for each row of Table 2, with threshold x0 and denominator
    Delta, every real x > x0 has a prime p with 1 - 1/Delta times x < p < x. The compared results
    are conditional, and every cited input is an explicit hypothesis, never an axiom. The main
    result, corollary57_of_inputs, says that every odd n with 5 < n < 1886389443 * 4 * 10^18 is a
    sum of three primes, from five inputs: 1, even Goldbach up to 4 * 10^18, the verification of
    Oliveira e Silva, Herzog and Pardi 2014; 2, Theorem 2 of Montgomery and Vaughan 1973, the
    Brun Titchmarsh inequality; 3, Dusart 2010 Theorem 5.2 at eta = 0.05, the bound
    |theta t - t| < 0.05 t / log^2 t for t >= 122568683, from which the Costa Pereira bound that
    the paper cites as Lemma 2.1 is proved; 4 and 5, the paper's own numerical display 2.64, in a slightly
    strengthened form, at the Table 2 rows log 4 * 10^18 and 57, taken as hypotheses. The range is the row 57 range,
    about 4 percent below the range 1966196911 * 4 * 10^18 printed in Corollary 1.2, which uses
    row 60. Ternary Goldbach itself is known unconditionally by Helfgott's work, so the interest
    of the corollary here is the method; binary Goldbach is open. The entry also proves
    kl45_of_inputs, Table 2 row 45 of Theorem 1.1 in a natural number form, from inputs 2, 3 and
    display 2.64 at row 45, and row_of_inputs, any row of Table 2 from the Costa Pereira bound,
    input 2 and display 2.64 at that row. AI agents, Claude by Anthropic and Codex by OpenAI,
    wrote the Lean code, with ported PrimeNumberTheoremAnd files credited to their authors in
    PORTING.md; it is offered for human audit.
  authors:
    - "Steve Hubbard"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Steve Hubbard"

classification:
  arxiv: ["math.NT"]
  msc2020: ["11N05", "11P32"]

sources:
  - title: "Short effective intervals containing primes"
    authors:
      - "Habiba Kadiri"
      - "Allysa Lumley"
    id: "arXiv:1407.7902"
    type: "article"
    location: "Integers 14, 2014, A61; arXiv 1407.7902: Theorem 1.1 and Table 2, Corollary 1.2 and its proof, section 2, display 2.64, section 3.1"
    relationship: "formalizes"
    note: >-
      Formalizes the argument of section 2 that turns display 2.64 at a row of Table 2 into the
      prime interval of Theorem 1.1 at that row, and the ladder of the proof of Corollary 1.2.
      Display 2.64, which the paper checks by computation with zero data, is taken as a
      hypothesis at each row used. Corollary 1.2 is formalized with Table 2 row 57 in place of
      row 60, a narrower range. The authors have not been contacted about this formalization.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "Empirical verification of the even Goldbach conjecture and computation of prime gaps up to 4 * 10^18"
    authors:
      - "Tomás Oliveira e Silva"
      - "Siegfried Herzog"
      - "Silvio Pardi"
    id: "doi:10.1090/S0025-5718-2013-02787-1"
    type: "article"
    location: "Math. Comp. 83, 2014, pages 2033 to 2060"
    relationship: "cited input, taken as an explicit hypothesis"
    note: >-
      Cited input of corollary57_of_inputs, the hypothesis hEven: every even n with
      4 <= n <= 4 * 10^18 is a sum of two primes. It is a large computer search and is not proved
      here. The authors have not been contacted about this formalization.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "The large sieve"
    authors:
      - "H. L. Montgomery"
      - "R. C. Vaughan"
    id: "Mathematika 20, 1973, pages 119 to 134"
    type: "article"
    location: "Mathematika 20, 1973, pages 119 to 134, Theorem 2"
    relationship: "cited input, taken as an explicit hypothesis"
    note: >-
      Cited input of every compared theorem, the hypothesis hMV, MVBrunTitchmarsh: for real
      x > 0 and y > 1 the number of primes in the interval from x to x + y, open at x, is less
      than 2 y / log y. It is not proved here. The authors have not been contacted about this
      formalization.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "Estimates of some functions over primes without R.H."
    authors:
      - "Pierre Dusart"
    id: "arXiv:1002.0442"
    type: "article"
    location: "arXiv 1002.0442, 2010, Theorem 5.2, the row k = 2, eta = 0.05, x >= 122568683"
    relationship: "cited input, taken as an explicit hypothesis"
    note: >-
      Cited input of corollary57_of_inputs and kl45_of_inputs, the hypothesis hDus. The paper
      cites the bound of Costa Pereira 1985 Theorem 5 as its Lemma 2.1; the entry proves that
      bound from this one. It is not proved here. The author has not been contacted about this
      formalization.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "Estimates for the Chebyshev function psi(x) - theta(x)"
    authors:
      - "N. Costa Pereira"
    id: "Math. Comp. 44, 1985, pages 211 to 221"
    type: "article"
    location: "Math. Comp. 44, 1985, pages 211 to 221, Theorem 5"
    relationship: "cited input, taken as an explicit hypothesis"
    note: >-
      Cited by the paper as Lemma 2.1. It is the hypothesis hC, CostaEstimate, of row_of_inputs
      only; in the other two compared theorems it is proved from Dusart's bound. The author has
      not been contacted about this formalization.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "PrimeNumberTheoremAnd"
    authors:
      - "the PrimeNumberTheoremAnd project contributors"
    id: "https://github.com/AlexKontorovich/PrimeNumberTheoremAnd"
    type: "formalization"
    location: "commit c39a751132c88b6e8080b74c74023fd95b3d8be0, files under LeanLab/PNTPort/StrongPNT/"
    relationship: "other"
    note: >-
      Sixteen files under LeanLab/PNTPort/StrongPNT, Mellin and residue calculus, bounds for
      zeta, the conjugation symmetry of zeta'/zeta, the zero free region and the strong prime
      number theorem, are ported from this Apache-2.0 project, written by its contributors, with
      small fixes for Mathlib v4.35.0-rc3 listed in PORTING.md; each file carries a notice. They
      are the same files as in the Dudek 2014 entry of this repository.
    license: "Apache-2.0"
    author_endorsement: "not-contacted"

related_formalizations: []

status:
  scope: >-
    Formalized, each conditional on explicit hypotheses: corollary57_of_inputs, Corollary 1.2
    with Table 2 row 57 in place of row 60, for odd n with 5 < n < 1886389443 * 4 * 10^18;
    kl45_of_inputs, Table 2 row 45 of Theorem 1.1; row_of_inputs, any row of Table 2 of Theorem
    1.1. Proved along the way: the smoothing argument of section 2, the explicit formula for psi
    with the sum over the zeros of zeta, the trivial zero terms, the weight integrals of section
    3.1, the rounding of the printed Table 2, the Costa Pereira bound from Dusart's bound, and a
    Lucas certificate of the prime 3999999999999999761 for the top of the ladder. Not formalized:
    the numerical check of display 2.64, the even Goldbach verification, the theorems of
    Montgomery and Vaughan and of Dusart, Corollary 1.2 with its printed range, the zero
    density estimates of section 3, and binary Goldbach, which remains open.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: ["Claude Opus 5.5 (claude-opus-5-5), Anthropic"]
      framework: "Claude Cowork"
      tool_setup: >-
        Autonomous agents of the Lean Lab read the paper, wrote the statements from it, proved
        the Costa Pereira bound from Dusart's bound, assembled the conditional theorems and ran
        lake build. A packaging agent ported the files to Lean 4 v4.35.0-rc3 and Mathlib
        v4.35.0-rc3, removed the declarations that rest on unproved lab statements, and ran the
        Lean kernel and the Comparator. Small kernel checks use decide +kernel; no native_decide.
      cost:
        wall_time: "agent runs over 2026-10-16 to 2026-11-22, and packaging on 2026-11-22"
        spend_usd: "subscription-based"
        hardware: "API-only, cloud sandbox and a desktop workstation"
      prompting_notes: >-
        The agents ran under a standing research brief to formalize published results related to
        Goldbach's problem and the inputs they cite, recording every cited input until proved.
    - method: "agent"
      models: ["Codex, OpenAI"]
      framework: "Codex"
      tool_setup: >-
        Codex prover agents of the Lean Lab wrote 29 of the 35 files under
        LeanLab/KadiriLumley2014 in lab tasks, as their headers and PORTING.md say: Table 2 and
        its arithmetic, the weight, the smoothing transform, the explicit formula with the zero
        sum and the steps of section 2.
  spend_usd: "subscription-based"
  notes: >-
    Steve Hubbard directed the project and decided what to publish. Claude and Codex wrote the
    Lean code, see PORTING.md; the files under LeanLab/PNTPort/StrongPNT/ are ported from
    PrimeNumberTheoremAnd and credited to its contributors. No file here contains a placeholder
    proof outside the Challenge file. No human expert has reviewed the mathematics.

fidelity:
  divergences: >-
    Every compared theorem is conditional, and each cited input is an explicit hypothesis,
    never an axiom. KLRow x0 Delta is Theorem 1.1 at one row: every real x > x0 has a natural
    prime p with 1 - 1/Delta times x < p < x. corollary57_of_inputs takes five hypotheses:
    hEven, EvenGoldbachUpTo 4 * 10^18, the verification of Oliveira e Silva, Herzog and Pardi,
    which also allows n = 4 = 2 + 2 and so asks no more than their computation; hMV,
    MVBrunTitchmarsh, Montgomery and Vaughan 1973 Theorem 2; hDus, Dusart 2010 Theorem 5.2 at
    eta = 0.05, |theta t - t| < 0.05 t / log^2 t for t >= 122568683, used in place of the
    paper's Lemma 2.1, the bound of Costa Pereira 1985 Theorem 5, which is proved from it; h0 and
    h57, display 2.64 of the paper at the Table 2 rows log 4 * 10^18 and 57. Inputs 4 and 5 are
    forms of the paper's own numerical display 2.64, taken as hypotheses, with the true
    absolute sum over the nontrivial zeros of zeta, counted with multiplicity, in place of the
    paper's bounds for it, at X = x0 divided by e^u times 1 + delta, slightly below the paper's
    X0 = x0 divided by e^u times 1 + delta - delta a, and with the printed a raised by one unit
    of its last digit, since a is printed rounded down. These two changes make each input
    slightly stronger than the display at the paper's exact a and X0; each says that the margin 2.05022 * 10^-3 sqrt X plus the endpoint tail and u / 2X is less
    than e^u - 1 times X times 1 + delta/2 minus the zero sum. The paper checks display 2.64 by
    computation; a floating point check by the lab, not certified, found it positive at rows
    log 4 * 10^18 and 57 from published zero data, with margins about 0.27 and 0.011, and
    negative at row 60 by about 0.02, so Corollary 1.2 is formalized with row 57, and its range
    1886389443 * 4 * 10^18 is about 4 percent below the printed range 1966196911 * 4 * 10^18.
    Its conclusion is that n is a sum of exactly three primes, as the proof gives. The proof
    covers x below e^57 by the row log 4 * 10^18, a step the printed proof leaves implicit, and
    uses the partition 4 * 10^18 + 2 = 241 + 3999999999999999761 where the paper uses another.
    kl45_of_inputs states row 45 as: every natural y > e^45 has a prime p < y with
    95381241 times y - p < y. row_of_inputs takes CostaEstimate, the paper's Lemma 2.1, as its
    hypothesis hC, together with hMV, membership of the row in tableTwo, the transcription of
    all twenty printed rows, and display 2.64 at that row. Ternary Goldbach is known
    unconditionally by Helfgott's work; binary Goldbach is open. The Lean code was written by AI.

review:
  status: "self-assessed"
  reviewers:
    - "Claude Opus 5.5, Anthropic, the packaging agent, not a human"
  notes: >-
    The packaging agent compared the Challenge with the lab statements of the three compared
    theorems and checked that every definition they reach is restated under its own name with
    the same open lines. Lean kernel and Comparator checks pass, and the axioms of each compared
    theorem are propext, Classical.choice and Quot.sound. The packaging agent did not check the
    transcription of Table 2, display 2.64 or Dusart's table against the papers; the lab's own
    checks are recorded in its notes. Not reviewed by a human expert or by the authors.

alignment:
  namespace: "LeanLab"
  statements:
    - source: "Kadiri and Lumley 2014, Corollary 1.2 with Table 2 row 57 in place of row 60, from the even verification to 4 * 10^18, Montgomery and Vaughan 1973 Theorem 2, Dusart 2010 Theorem 5.2 and display 2.64 at rows log 4 * 10^18 and 57"
      lean: "LeanLab.KadiriLumley2014.PalomarEntry57.corollary57_of_inputs"
      module: "ChallengeKadiriLumley2014"
      status: "proved"
    - source: "Kadiri and Lumley 2014, Theorem 1.1 at Table 2 row 45, from Montgomery and Vaughan 1973 Theorem 2, Dusart 2010 Theorem 5.2 and display 2.64 at row 45"
      lean: "LeanLab.KadiriLumley2014.PalomarKL45.kl45_of_inputs"
      module: "ChallengeKadiriLumley2014"
      status: "proved"
    - source: "Kadiri and Lumley 2014, Theorem 1.1 at any row of Table 2, from Lemma 2.1, Montgomery and Vaughan 1973 Theorem 2 and display 2.64 at that row"
      lean: "LeanLab.KadiriLumley2014.PalomarEntry.row_of_inputs"
      module: "ChallengeKadiriLumley2014"
      status: "proved"

