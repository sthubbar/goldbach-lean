# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Mémoire sur les nombres premiers"
  description: >-
    A Lean 4 proof, with no unproved steps and no hypotheses, of explicit two-sided bounds for
    Chebyshev's function psi from P. L. Chebyshev, Mémoire sur les nombres premiers, 1852, with
    Chebyshev's constant A = log 2/2 + log 3/3 + log 5/5 - log 30/30 = 0.92129.... For every
    natural number n at least 30, psi of n is at least A n - 5 log n + 2 log 30 - 1; for every
    natural number n, psi of n is at most 6A/5 n + 2 log^2 n + 160. The proof uses Chebyshev's
    combination of log n!, log of the factorials of n/2, n/3 and n/5, and log of the factorial
    of n/30, as in the paper, with error terms weaker than Chebyshev's. Mathlib has Chebyshev type
    bounds only with the constants log 2 and log 4. The Lean code was written by an AI agent and
    is offered for human audit. Goldbach's conjecture is open and is not claimed.
  authors:
    - "Steve Hubbard"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Steve Hubbard"

classification:
  arxiv: ["math.NT"]
  msc2020: ["11N05", "11A41"]

sources:
  - title: "Mémoire sur les nombres premiers"
    authors:
      - "P. L. Chebyshev"
    id: "http://www.numdam.org/item/JMPA_1852_1_17__366_0/"
    type: "article"
    location: "Journal de mathématiques pures et appliquées, 1re série, 17, 1852, pages 366-390"
    relationship: "formalizes"
    note: >-
      Formalizes the explicit lower and upper bounds for psi obtained from Chebyshev's
      combination of the logarithms of the factorials of x, x/2, x/3, x/5 and x/30, with signs
      plus, minus, minus, minus, plus, and Chebyshev's constant A. The argument is a natural number and the error terms are the
      explicit ones reached by the Lean proof, weaker than those printed; see fidelity. The
      author cannot be contacted.
    license: "public-domain"
    author_endorsement: "not-contacted"

related_formalizations:
  - id: "https://github.com/leanprover-community/mathlib4/blob/v4.35.0-rc3/Mathlib/NumberTheory/Chebyshev.lean"
    relationship: "weaker Chebyshev type bounds in Mathlib"
    note: >-
      Mathlib has Chebyshev type bounds only with the constants log 2 and log 4: psi_ge and
      pi_ge, psi of n at least n log 2 - log of n + 1; theta_le_log4_mul_x, theta of x at most
      x log 4; psi_le, psi of x at most x log 4 + 2 sqrt x log x; and psi_le_const_mul_self.
      A search of Mathlib for chebyshev, psi and theta bounds found no bound with Chebyshev's
      1852 constant A. This entry uses Mathlib's psi and its bounds for log of the factorial.

status:
  scope: >-
    Formalized, with no hypothesis: psi_ge_chebyshev30, for every natural n at least 30,
    A n - 5 log n + 2 log 30 - 1 is at most psi of n; and psi_le_chebyshev30, for every natural n,
    psi of n is at most 6A/5 n + 2 log^2 n + 160. Not formalized: the paper's sharper error
    terms, its bounds for real x, its consequences for the prime counting function and
    Bertrand's postulate in the paper's form, and its other results.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: ["Claude Opus 5.5 (claude-opus-5-5), Anthropic"]
      framework: "Claude Cowork"
      tool_setup: >-
        An autonomous agent wrote every Lean file, ran lake build and printed the axioms of
        each theorem in the lab on Lean 4 v4.35.0; a packaging agent ported the files to
        Lean 4 v4.35.0-rc3, Mathlib v4.35.0-rc3, and ran the Lean kernel and the Comparator.
      cost:
        wall_time: "under one hour of agent time on 2026-10-19, and packaging on 2026-11-01"
        spend_usd: "subscription-based"
        hardware: "API-only, cloud sandbox"
      prompting_notes: >-
        The agent ran under a standing research brief to formalize published results related
        to Goldbach's problem and the analytic inputs they cite.
  spend_usd: "subscription-based"
  notes: >-
    The submitter directed the project and decided what to publish; an AI agent wrote all Lean
    code and the statements. No human expert has reviewed the mathematics.

fidelity:
  divergences: >-
    The argument of psi is a natural number n, coerced to the reals, not an arbitrary real x.
    The lower bound is stated for n at least 30 with error term -5 log n + 2 log 30 - 1, and
    the upper bound for every n with error term 2 log^2 n + 160; Chebyshev's printed bounds,
    for real x greater than 1, are A x - 5/2 log x - 1 below and
    6/5 A x + 5/(4 log 6) log^2 x + 5/4 log x + 1 above, so his error terms are smaller and
    the Lean statements are strictly weaker. The upper constant 6A/5 is Chebyshev's. psi is Mathlib's Chebyshev.psi,
    the sum of the von Mangoldt function up to x, which is Chebyshev's psi.

review:
  status: "self-assessed"
  reviewers:
    - "none"
  notes: >-
    Statements checked by AI agents against the paper; Lean kernel and Comparator checks pass.
    Not reviewed by a human expert.

alignment:
  namespace: "GoldbachLean"
  statements:
    - source: "Chebyshev 1852, explicit lower bound for psi with constant A"
      lean: "GoldbachLean.Chebyshev1852.Explicit.psi_ge_chebyshev30"
      module: "ChallengeChebyshev1852"
      status: "adapted"
      note: "Natural n at least 30, error term -5 log n + 2 log 30 - 1."
    - source: "Chebyshev 1852, explicit upper bound for psi with constant 6A/5"
      lean: "GoldbachLean.Chebyshev1852.Explicit.psi_le_chebyshev30"
      module: "ChallengeChebyshev1852"
      status: "adapted"
      note: "Every natural n, error term 2 log^2 n + 160."

acknowledgements: "Mathlib and the Lean FRO; P. L. Chebyshev for the mathematics."
