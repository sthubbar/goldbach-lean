# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Sums of two odd primes in short intervals: a correction to Lemma 7 of Kaniecki's paper on Šnirelman's constant"
  description: >-
    A Lean 4 proof, with no unproved steps, of a corrected form of Lemma 7 of L. Kaniecki, On
    Šnirelman's constant under the Riemann hypothesis, Acta Arith. 72, 1995, pages 361-374.
    Page 371 defines lambda of x as 2 for 0 < x <= 7 and, for x > 7, as the largest gap p' - p
    between a prime p <= x and the next prime p'. Lemma 7 as printed says that every open
    interval from x to x + lambda of lambda of x, x > 4, contains a sum of two odd primes. That
    statement is false: lambda of 6 = lambda of 2 = 2, and the open interval from 6 to 8 holds
    no even number; a numerical check by the lab found the failure at every even integer from 6
    to 88 and nowhere else below 2000. The entry proves that the printed lemma is false, at the
    real point x = 6 and at the integer 6, and proves the corrected lemma with the right end
    included: for every real x > 4 there are odd primes p and q with
    x < p + q <= x + lambda of lambda of x, and the same for every integer x > 4 with lambda
    computed on the integers. The printed proof goes through with this change and a repair at
    x - p1 = 7. Section 3 of the paper applies the lemma only through closed intervals, which
    contain the half-open ones, so the paper's Theorem is not affected; that remark is not part
    of the formal statements. No compared theorem uses the Riemann hypothesis or any cited
    input. Binary Goldbach is open and is not claimed. AI agents wrote the Lean code, Claude by
    Anthropic and Codex by OpenAI, as listed in PORTING.md, and it is offered for human audit.
  authors:
    - "Steve Hubbard"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Steve Hubbard"

classification:
  arxiv: ["math.NT"]
  msc2020: ["11P32", "11N05"]

sources:
  - title: "On Šnirelman's constant under the Riemann hypothesis"
    authors:
      - "L. Kaniecki"
    id: "Acta Arithmetica 72, 1995, pages 361-374"
    type: "article"
    location: "Acta Arithmetica 72, 1995, pages 361-374, page 371"
    relationship: "formalizes"
    note: >-
      Formalizes the definition of lambda and Lemma 7 on page 371: the printed open interval
      form is proved false, and the form with the right end included is proved, by the printed
      argument with a repair at x - p1 = 7. The author has not been contacted about this
      formalization or the correction.
    license: "unknown"
    author_endorsement: "not-contacted"

status:
  scope: >-
    Formalized, with no hypothesis: Lemma 7 as printed is false, not_lemma7_printed for real x
    and lemma7_printed_false_at_6 for the integer x = 6; the corrected Lemma 7 for real x > 4,
    lemma7_closed_real, and for integer x > 4, lemma7_closed. The integer statements are
    derived results of the entry that restate the paper's lemma on the integers. Not
    formalized: Lemmas 1 to 6, the explicit formula of Section 2, the numerical work of
    Section 3 and the Theorem of the paper, which assumes the Riemann hypothesis, and binary
    Goldbach, which remains open.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: ["Claude Opus 5.5 (claude-opus-5-5), Anthropic", "Codex, OpenAI"]
      framework: "Claude Cowork"
      tool_setup: >-
        Autonomous agents wrote the Lean files, ran lake build, read the paper and wrote the
        statements from it; a separate AI subagent checked the statements against the page
        image and a falsifier agent checked the failure at x = 6 numerically. Claude wrote the
        integer lemma and the statements of the real gap function, and Codex task127 wrote the
        extension to real x, as PORTING.md lists. A packaging agent ported the files to Lean 4
        v4.35.0-rc3, Mathlib v4.35.0-rc3, and ran the Lean kernel and the Comparator. No
        native_decide.
      cost:
        wall_time: "agent runs over 2026-10-18 to 2026-10-26, and packaging on 2026-11-15"
        spend_usd: "subscription-based"
        hardware: "API-only, cloud sandbox and a desktop workstation"
      prompting_notes: >-
        The agents ran under a standing research brief to formalize published results related to
        Goldbach's problem and the inputs they cite, recording every cited input until proved.
  spend_usd: "subscription-based"
  notes: >-
    Steve Hubbard directed the project and decided what to publish. Claude wrote the
    statements, the counterexample and the integer proof; Codex wrote the real extension, as
    listed in PORTING.md. No file here contains a placeholder proof outside the Challenge
    file. No human expert has reviewed the mathematics.

fidelity:
  divergences: >-
    The paper defines lambda for x > 0; here lambda of x is 2 for every x <= 7, a value never
    used since lambda is at least 2. A sum of two odd primes is read as p + q with p and q odd
    primes, ordered pairs, not necessarily distinct. The printed lemma is stated for real x > 4
    with the open interval, as on page 371; the correction includes the right end and keeps the
    left end open. The integer gap function lam on natural numbers agrees with the real one at
    every natural number, and the integer forms are stated with it. No constant or range of
    the paper is changed.

review:
  status: "self-assessed"
  reviewers:
    - "Claude Opus 5.5, Anthropic, an AI statement auditor, not a human"
  notes: >-
    An AI statement audit in the lab checked the definition of lambda and Lemma 7 against page
    371 of the paper scan, read at 150 dpi: the branch at 7, the maximum over primes p <= x,
    the nested lambda of lambda of x, the bound x > 4 and the open interval as printed; and it
    rechecked the failure at x = 6 in Python. The packaging agent checked the Challenge against
    the lab statements. Lean kernel and Comparator checks pass. Not reviewed by a human expert
    or by the author.
    A second, separate AI agent, Claude Opus 5.5 by Anthropic, not a human, audited the
    Challenge against the lab transcription, rechecked the counterexample and the failures at
    the even integers 6 to 88, and found the statements non vacuous; it could not open page
    371 itself.

alignment:
  namespace: "LeanLab"
  statements:
    - source: "Kaniecki 1995, Lemma 7 as printed, page 371, is false"
      lean: "LeanLab.Kaniecki1995.not_lemma7_printed"
      module: "ChallengeKaniecki1995"
      status: "proved"
    - source: "Kaniecki 1995, Lemma 7 as printed, page 371, fails at the integer x = 6"
      lean: "LeanLab.KanieckiGap.lemma7_printed_false_at_6"
      module: "ChallengeKaniecki1995"
      status: "proved"
    - source: "Kaniecki 1995, Lemma 7, page 371, with the right end included, real x > 4"
      lean: "LeanLab.KanieckiGap.RealIntervals127.lemma7_closed_real"
      module: "ChallengeKaniecki1995"
      status: "proved"
    - source: "Kaniecki 1995, Lemma 7, page 371, with the right end included, integer x > 4, derived result of the entry"
      lean: "LeanLab.KanieckiGap.lemma7_closed"
      module: "ChallengeKaniecki1995"
      status: "proved"

acknowledgements: "Mathlib and the Lean FRO; L. Kaniecki for the paper."
