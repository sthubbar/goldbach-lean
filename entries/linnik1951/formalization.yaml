# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Prime numbers and powers of two"
  description: >-
    A Lean 4 proof of the theorem of Yu. V. Linnik, Prime numbers and powers of two, Trudy Mat.
    Inst. Steklov 38, 1951, pages 152 to 169, in its qualitative form: conditional on the
    generalized Riemann hypothesis for Dirichlet L-functions, there is a constant K such that
    every sufficiently large even integer is the sum of two primes and at most K powers of two,
    each power 2^v with v >= 1. The one hypothesis is GRH, taken as an explicit hypothesis and
    never as an axiom: for every modulus q >= 1, every Dirichlet character chi modulo q and every
    s in the open strip 0 < Re s < 1, if the L-function of chi vanishes at s then Re s = 1/2.
    The constant K is not explicit. The theorem printed on page 154 is an asymptotic formula
    for the number of representations of N as two primes and exactly k powers of two, for each
    fixed k >= 3; the entry proves the qualitative consequence that Linnik draws from it on
    pages 168 and 169, and not the asymptotic formula itself. Linnik 1953 and Gallagher 1975
    later removed the hypothesis GRH, and the gallagher1975 entry of this repository is the
    unconditional result. The route uses a repaired bound for the mixed integral of page 160
    with log N to the power 7 in place of the power 6 printed in display 5.5, whose power 6 form
    the lab could not derive; the extra logarithm does not change the conclusion. Binary
    Goldbach, the case K = 0, is open and is not claimed. AI agents wrote the Lean code, Claude
    by Anthropic and Codex by OpenAI, as listed in PORTING.md, and it is offered for human
    audit.
  authors:
    - "Steve Hubbard"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Steve Hubbard"

classification:
  arxiv: ["math.NT"]
  msc2020: ["11P32", "11P55", "11M26"]

sources:
  - title: "Prime numbers and powers of two"
    authors:
      - "Yu. V. Linnik"
    id: "https://www.mathnet.ru/eng/tm1114"
    type: "article"
    location: "Trudy Mat. Inst. Steklov 38, 1951, pages 152 to 169: the theorem on page 154; Lemma 2 on pages 156 to 159; display 5.5 on page 160; the conclusion on pages 168 and 169"
    relationship: "adapts"
    note: >-
      Follows Linnik's circle method proof under GRH and proves the qualitative consequence of
      the theorem of page 154 that pages 168 and 169 draw, not the asymptotic formula of page
      154. The Mellin transfer estimate of page 159 is proved from GRH. Display 5.5 on page 160
      is used in a repaired form with log N to the power 7, see the fidelity block. The original
      Russian scan was the authority for the statements. The author cannot be contacted.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "Primes and powers of 2"
    authors:
      - "P. X. Gallagher"
    id: "doi:10.1007/BF01390190"
    type: "article"
    location: "Inventiones Mathematicae 29, 1975, pages 125-142: Lemmas 1 and 2"
    relationship: "background"
    note: >-
      Gallagher's Lemmas 1 and 2 for g = 2, on the large values of the exponential sum over
      powers of 2, are proved in LeanLab/Linnik/Gallagher1975Lemma1.lean and
      Gallagher1975Lemma2.lean and used on the route for the measure of the set where that sum is
      large. Gallagher's theorems prove Linnik's result without GRH; they are the
      gallagher1975 entry of this repository, not this one.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "PrimeNumberTheoremAnd"
    authors:
      - "Arend Mellendijk"
      - "the PrimeNumberTheoremAnd project contributors"
    id: "https://github.com/AlexKontorovich/PrimeNumberTheoremAnd"
    type: "formalization"
    location: "commit c39a751132c88b6e8080b74c74023fd95b3d8be0"
    relationship: "other"
    note: >-
      Sixteen files under LeanLab/PNTPort/StrongPNT, the zero-free region for zeta, Mellin and
      residue calculus and the prime number theorem with classical error term, four files under
      LeanLab/PNTSieve, the Selberg sieve and its bounds by Arend Mellendijk, and the narrow
      ports LeanLab/PNTPort/Perron/Sinc.lean, Cauchy.lean and Cutoff.lean, are ported from this
      Apache-2.0 project with small fixes for Mathlib v4.35.0-rc3, listed in PORTING.md; each
      file carries a notice.
    license: "Apache-2.0"
    author_endorsement: "not-contacted"

related_formalizations:
  - id: "https://github.com/sthubbar/goldbach-lean/tree/main/entries/gallagher1975"
    relationship: "registered entry of this repository with the unconditional result"
    note: "Gallagher 1975 Theorems 1 and 2 for base 2, which give two primes and a bounded number of powers of 2 without GRH."

status:
  scope: >-
    Formalized, with GRH for Dirichlet L-functions in the open strip as the one hypothesis:
    the qualitative form of Linnik's theorem, linnik1951_decomposed_final_b1122, that some K
    makes every sufficiently large even integer a sum of two primes and at most K powers of two.
    Not formalized: the asymptotic formula of page 154 for the number of representations with
    exactly k powers of two, an explicit value of K or of the threshold, display 5.5 of page
    160 with log N to the power 6, the unconditional results of Linnik 1953 and Gallagher 1975,
    which the gallagher1975 entry covers, and binary Goldbach, which remains open.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: ["Claude Opus 5.5, claude-opus-5-5, Anthropic"]
      framework: "Claude Cowork"
      tool_setup: >-
        Autonomous agents of the Lean Lab read the paper, wrote the statements from the
        original Russian scan, decomposed the proof into leaf lemmas and proved them, and ran
        lake build and a walk of the constants of the final theorem, which reaches no unproved
        step. A packaging agent ported the files to Lean 4 v4.35.0-rc3, Mathlib v4.35.0-rc3,
        removed the declarations that rest on unproved leaves, and ran the Lean kernel and the
        Comparator. No native_decide.
      cost:
        wall_time: "agent runs over 2026-10-16 to 2026-11-22, and packaging on 2026-11-22"
        spend_usd: "subscription-based"
        hardware: "API-only, cloud sandbox and a desktop workstation"
      prompting_notes: >-
        The agents ran under a standing research brief to formalize published results related to
        Goldbach's problem and the inputs they cite, recording every cited input until proved.
    - method: "agent"
      models: ["GPT-6 Codex, OpenAI"]
      framework: "Codex"
      tool_setup: >-
        Codex prover agents of the Lean Lab, lab tasks 111 to 555, wrote most of the
        LeanLab/Linnik1951/Decomp*.lean files and their support files, decomposing and proving
        steps of Linnik's argument, as the lab's statement ledger records task by task.
  spend_usd: "subscription-based"
  notes: >-
    Steve Hubbard directed the project and decided what to publish. Claude wrote the statement
    files, the final route and the proof of the Mellin transfer estimate from GRH; Codex by
    OpenAI wrote most decomposition files; a few leaves come from other lab prover runs, see
    PORTING.md. No file here contains a placeholder proof outside the Challenge file. No human
    expert has reviewed the mathematics.

fidelity:
  divergences: >-
    The one hypothesis is GRH, LeanLab.DERZ1997.GRH: for every q >= 1, every Dirichlet
    character chi modulo q and every complex s with 0 < Re s < 1, Mathlib's L-function of chi
    vanishing at s implies Re s = 1/2. Taking the open strip leaves out the trivial zeros and
    the zeros on Re s = 0 of the Euler factors of imprimitive characters, which the extended
    Riemann hypothesis of page 154 does not concern; q = 1 gives the Riemann hypothesis. The
    conclusion is the qualitative statement: there are K and N0 such that every even N > N0 is
    p + q + 2^v1 + ... + 2^vk with p and q prime, each vi >= 1 and k <= K. The theorem printed
    on page 154 is stronger, an asymptotic formula for the number Q_k of N of such
    representations with exactly k powers of two, with the singular series in the main term,
    for each fixed k >= 3 and N > N0 of k; only its consequence that some K works is proved.
    The proof uses for the mixed integral of page 160 the bound C N log^7 N / sqrt of q tau,
    with tau = N^{1/7}, where display 5.5 prints log^6 N; the printed display appears to drop
    a factor q over phi of q, and the lab could not derive the power 6. The local expansion of
    equation 6.4 then carries log^13 N, and the power saving in 1 / tau + 1 / sqrt of q tau
    absorbs it. Constants and thresholds are existential and not explicit, as in the paper.

review:
  status: "self-assessed"
  reviewers:
    - "Claude Opus 5.5, Anthropic, the packaging agent, not a human"
  notes: >-
    The packaging agent compared the Challenge with the lab statement of Linnik's theorem and
    checked that every definition the compared theorem reaches, GRH, LinnikExact, LinnikAtMost
    and AllLargeEven, is restated under its own name with the same open lines. In the lab, three
    independent AI reviewers, also Claude and not humans, tried to refute the faithfulness of
    the top statement against page 154, of the uniform bound for log L in the strip against page
    159, and of the Mellin pieces and the power 7 repair against page 160, and found them
    faithful. Lean kernel and Comparator checks pass. Not reviewed by a human expert.

alignment:
  namespace: "LeanLab"
  statements:
    - source: "Linnik 1951, the theorem of page 154 in its qualitative form, with the conclusion of pages 168 and 169, under GRH"
      lean: "LeanLab.Linnik1951.linnik1951_decomposed_final_b1122"
      module: "ChallengeLinnik1951"
      status: "proved"

acknowledgements: "Mathlib and the Lean FRO; Arend Mellendijk and the PrimeNumberTheoremAnd contributors; Yu. V. Linnik for the paper and P. X. Gallagher for the lemmas used."
