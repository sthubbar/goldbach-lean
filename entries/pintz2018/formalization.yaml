  statements:
    - source: "Pintz 2018, Theorem K, display 4.41, proof displays 8.10 to 8.16"
      lean: "LeanLab.Pintz2018.Greedy117.theoremK_ordered_integral"
      module: "ChallengePintz2018"
      status: "proved"
    - source: "Pintz 2018, Theorem K, displays 4.41 and 4.42, abstract cost"
      lean: "LeanLab.Pintz2018.Residual117.saturation_and_residual"
      module: "ChallengePintz2018"
      status: "proved"
    - source: "Pintz 2018, Theorem J, display 4.36 from 7.20 by displays 8.1 to 8.4, 7.20 as a hypothesis"
      lean: "LeanLab.Pintz2018.Density117.excess_bound_of_720"
      module: "ChallengePintz2018"
      status: "proved"
    - source: "Pintz 2018, Section 9, basic inequality 9.4 as applied in 9.22"
      lean: "LeanLab.Pintz2018.basic_ineq"
      module: "SolutionPintz2018"
      status: "proved"
    - source: "Pintz 2018, Section 9, Case 8, displays 9.33 to 9.37"
      lean: "LeanLab.Pintz2018.case8"
      module: "SolutionPintz2018"
      status: "proved"

acknowledgements: "Mathlib and the Lean FRO; J. Pintz for the paper."
