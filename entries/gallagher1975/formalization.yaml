# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Primes and powers of 2: Gallagher's mean square theorem and the asymptotic count of two primes and k powers of 2"
  description: >-
    A Lean 4 proof, with no unproved steps, of the two main theorems of P. X. Gallagher, Primes
    and powers of 2, Invent. Math. 29, 1975, for the base g = 2. Let r'_k of n count the
    representations n = p + 2^v1 + ... + 2^vk with p prime and 1 <= vi <= L, the integer part
    of log_2 N, and let r''_k of N count the representations N = p1 + p2 + 2^v1 + ... + 2^vk.
    Theorem 1, display 3 on page 125: for every k >= 1 and N >= N_k, the sum over odd n <= N of
    the square of r'_k of n minus 2 L^k / log N is at most C times log^2 2k / k times
    N L^{2k-2}, with an absolute constant C. Theorem 2, display 4 on page 125: for every k >= 2
    and every even N >= N_k, r''_k of N differs from 2 N L^k / log^2 N by at most K times
    log^2 k / k times 2 N L^k / log^2 N, with an absolute constant K. Binary Goldbach is open
    and is not claimed. AI agents wrote the Lean code, Claude by Anthropic and
    Codex by OpenAI, as listed in PORTING.md, and it is offered for human audit.
  authors:
    - "Steve Hubbard"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Steve Hubbard"

classification:
  arxiv: ["math.NT"]
  msc2020: ["11P32", "11P55", "11N36", "11M26"]

