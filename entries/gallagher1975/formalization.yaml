    relationship: "formalizes"
    note: >-
      Formalizes Theorem 1, display 3, and Theorem 2, display 4, both on page 125, for the base
      g = 2, following the paper's route: the major arcs of Section 1 with the zero density
      estimate near 1 and the exceptional character, the minor arcs through Lemma 11, Lemma 2 on
      the large values of the exponential sum over powers of 2, Lemma 12, the bound of display 6
      on page 139, and the counting identity of page 140 for Theorem 2. The author has not
      been contacted about this formalization.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "The exceptional set in Goldbach's problem"
    authors:
      - "H. L. Montgomery"
      - "R. C. Vaughan"
    id: "Acta Arithmetica 27, 1975, pages 353-370"
    type: "article"
    location: "Acta Arithmetica 27, 1975, pages 353-370"
    relationship: "adapts"
    note: >-
      Gallagher's reference 10. The three estimates that Gallagher cites from it, the Gauss sum
      bound behind display 5 and the two singular series estimates of display 11, the latter
      from equations 6.13 and 6.14 on page 363, are proved here as inputs in
      LeanLab/Linnik/Decomp507a.lean, not assumed. The authors have not been contacted.
    license: "unknown"
    author_endorsement: "not-contacted"
