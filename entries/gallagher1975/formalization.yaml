related_formalizations:
  - id: "https://github.com/sthubbar/goldbach-lean/tree/main/entries/romanov1934"
    relationship: "registered entry of this repository on the integers p + 2^k, which Gallagher's theorems refine"
    note: "Romanov's theorem with Erdős' complement; its second moment method gives Lemma 12 here, in LeanLab/Romanov/GallagherBridge.lean."

status:
  scope: >-
    Formalized, with no hypothesis, for the base g = 2: Gallagher's Theorem 1, display 3,
    theorem1_of_leaves, and Theorem 2, display 4, theorem2_of_leaves. No compared theorem goes
    beyond the paper. Not formalized: the theorems for a general base g, explicit values of the
    constants and of N_k, and binary Goldbach, which remains open.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: ["Claude Opus 5.5 (claude-opus-5-5), Anthropic", "Codex, OpenAI"]
      framework: "Claude Cowork"
      tool_setup: >-
        Autonomous agents wrote the Lean files, ran lake build, read the paper and wrote the
        statements from it; PORTING.md lists which agent wrote which file where the lab notes
        say so. Codex task507 proved the three leaves cited from Montgomery and Vaughan 1975,
        and other Codex tasks proved further leaves. A packaging agent ported the files to Lean
        4 v4.35.0-rc3, Mathlib v4.35.0-rc3, and ran the Lean kernel and the Comparator. No
        native_decide.
      cost:
        wall_time: "agent runs over 2026-10-16 to 2026-11-05, and packaging on 2026-11-14"
        spend_usd: "subscription-based"
        hardware: "API-only, cloud sandbox and a desktop workstation"
      prompting_notes: >-
        The agents ran under a standing research brief to formalize published results related to
        Goldbach's problem and the inputs they cite, recording every cited input until proved.
  spend_usd: "subscription-based"
  notes: >-
    Steve Hubbard directed the project and decided what to publish. Claude wrote the statements
    and the decomposition of Gallagher's proof; Codex and other lab prover agents proved leaves,
    as listed in PORTING.md. No file here contains a placeholder proof outside the Challenge
    file. No human expert has reviewed the mathematics.

fidelity:
  divergences: >-
    Only the base g = 2 is treated. The implied constants of << and O are explicit existential
    constants independent of k, as in the paper, and N >= N_k is an explicit threshold depending on k.
    r'_k of n counts pairs of a prime p and an exponent tuple in [1, L]^k, with L the integer
    part of log_2 N, and the sum in Theorem 1 runs over the odd n <= N, as the definition of r'_k for odd n on
    page 125, the remark on page 126 and the dashed sums of page 139 fix. r''_k of N counts ordered triples of two primes and an exponent tuple. Theorem 2 is stated for k >= 2,
    as in the paper.

review:
  status: "self-assessed"
  reviewers:
    - "Claude Opus 5.5, Anthropic, an AI statement auditor, not a human"
  notes: >-
    An AI statement audit by the packaging agent checked the Challenge against the statements
    of page 125 as the lab files transcribe them with page references: the definitions of r'_k
    and r''_k, the range 1 to L of the exponents, the main terms 2 L^k / log N and
    2 N L^k / log^2 N, that the constants C and K are absolute and uniform in k, the parity
    conditions, and that neither theorem holds trivially, since the trivial bounds lack the
    factor log^2 2k / k. A second, independent AI audit, also Claude Opus 5.5 and not a human,
    then reread pages 125, 126 and 138 to 140 of the paper scan and found both statements
    faithful for g = 2. Lean kernel and Comparator
    checks pass. Not reviewed by a human expert or by the author.

alignment:
  namespace: "LeanLab"
  statements:
    - source: "Gallagher 1975, Theorem 1, display 3, page 125, g = 2"
      lean: "LeanLab.Linnik.Decomp1532c.theorem1_of_leaves"
      module: "ChallengeGallagher1975"
      status: "proved"
    - source: "Gallagher 1975, Theorem 2, display 4, page 125, g = 2"
      lean: "LeanLab.Linnik.Decomp1532c.theorem2_of_leaves"
      module: "ChallengeGallagher1975"
      status: "proved"

acknowledgements: "Mathlib and the Lean FRO; Arend Mellendijk and the PrimeNumberTheoremAnd contributors; P. X. Gallagher, H. L. Montgomery and R. C. Vaughan for the papers."
