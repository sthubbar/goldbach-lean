version: "v0.4"

project:
  name: "Goldbach numbers in intervals of length 4.45 log² x under the Riemann Hypothesis"
  description: >-
    A Lean 4 proof that, under the Riemann Hypothesis, for every real x at least
    3 there is a Goldbach number n, a sum of two odd primes, with x < n < x + 4.45 (log x)^2.
    This improves the constant 123 of A. Chirre and M. V. Hagen, On Goldbach numbers in short
    intervals, arXiv 2512.23534, by their method. RH is the paper's own hypothesis. The theorem
    is conditional on seven cited inputs taken as explicit hypotheses, never as axioms, all
    stated for gZ, the ordinates of the nontrivial zeros of the Riemann zeta function counted
    with multiplicity: ExplicitA, the truncated explicit formula of Montgomery and Vaughan,
    Multiplicative Number Theory I, display 12.1, under RH; HadamardK, the bound
    sum over gamma' of 4/(4 + (gamma - gamma')^2) at most log |gamma|, a consequence of the
    Hadamard product, under RH; Ordinates14, every ordinate at least 14 in absolute value;
    BPTN, the zero count of Brent, Platt and Trudgian, J. Number Theory 238, 2022, Lemma 1, for
    T at least 10^13; HSWN70 and HSWHead14, the zero count of Hasanalizade, Shen and Wong,
    arXiv 2107.06506, Corollary 1.2, for T at least 70 and T at least 14; and
    EvenGoldbachUpTo 4*10^18, the verification of the even Goldbach conjecture to 4*10^18 by
    Oliveira e Silva, Herzog and Pardi, Math. Comp. 83, 2014. These are the Lean Lab's
    transcriptions, not Mathlib results. Everything else in the argument is proved: Theorem 2
    of Chirre and Hagen with the diagonal constant lowered to 1.0068, the passage from psi to
    theta, and their Section 5. Binary Goldbach is open and is not claimed. An AI agent,
    Claude, wrote the Lean code, with the ported PrimeNumberTheoremAnd files credited to their
    authors in PORTING.md; the statements were checked against the papers by AI agents and are
    offered for human audit.
  authors:
    - "Steve Hubbard"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Steve Hubbard"

