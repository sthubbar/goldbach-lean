fidelity:
  divergences: >-
    The result is conditional. RH is Mathlib's RiemannHypothesis, the premise of the conclusion.
    Seven cited inputs are explicit hypotheses of the theorem, never axioms, each stated for gZ,
    the imaginary parts of the zeros of riemannZeta with real part at least -1/2, which are the
    nontrivial zeros, indexed with multiplicity analyticOrderNatAt. ExplicitA gZ Z delta, assumed
    under RH for every 0 < delta at most 10^-13: for almost every y at least 2 the finite sums
    over Z n of c_rho y^rho, c_rho = ((1+delta)^rho - 1)/rho, rho = 1/2 + i gamma, tend to
    -(V(delta, y) - B(delta, y)), V = psi((1+delta)y) - psi(y) - delta y, B the trivial zero
    term; Z is an arbitrary sequence of finite sets of zeros, universally quantified in the
    theorem, so the hypothesis asks that this sequence of truncations converges, as the
    Montgomery-Vaughan formula 12.1 at y and (1+delta)y gives for truncation at heights T_n.
    HadamardK gZ, assumed under RH: for every finite set s and ordinate gamma, the sum over
    gamma' in s of 4/(4 + (gamma - gamma')^2) is at most log |gamma|. Ordinates14 gZ: every
    |gamma| at least 14. BPTN gZ, assumed under RH: Brent-Platt-Trudgian Lemma 1,
    N(T) = (T/2pi) log(T/(2pi e)) + 7/8 + Q(T), |Q(T)| at most 0.137 log T + 0.443 log log T +
    1.588 + 0.2/T, read as counts of ordinates of both signs over any finite set, for T at least
    10^13. HSWN70 gZ and HSWHead14 gZ: Hasanalizade-Shen-Wong Corollary 1.2,
    |N(T) - (T/2pi) log(T/(2pi e))| at most 0.1038 log T + 0.2573 log log T + 9.3675, with the
    7/8 moved into the error, so 10.2425, as the same two-sided counts for T at least 70 and as
    the upper count for T at least 14. EvenGoldbachUpTo 4*10^18: every even n with
    4 <= n <= 4*10^18 is a sum of two primes. A Goldbach number is a natural number that is the
    sum of two odd primes, as in Chirre and Hagen. The interval is open on both sides,
    x < n < x + 4.45 (log x)^2, for real x at least 3. The Lean code was written by AI. Binary
    Goldbach is open.

review:
  status: "self-assessed"
  reviewers:
    - "AI packaging agent: an instance of Claude Opus 5.5, claude-opus-5-5, Anthropic; not a human reviewer"
  notes: >-
    Status is self-assessed: every check was done by AI agents of the same model that wrote
    the Lean code, so it is not an independent review and not a human expert review. The
    packaging agent built the entry, ran the Lean kernel and the Comparator, and printed the
    axioms of the compared theorem. A separate AI faithfulness and vacuity audit, by another
    instance of the same model that did not write the entry, compared the Challenge with the
    preprint and found each hypothesis true of the actual zeros under RH, so the theorem is
    not vacuous. Zall excludes the trivial zeros and s = 1, where Mathlib's riemannZeta is
    nonzero, so gZ is the nontrivial ordinates with multiplicity and Ordinates14 holds. Z is
    universally quantified, and ExplicitA fails for a bad Z, for instance Z n empty, but it
    holds for the height truncations Z n = {|gamma| <= n} for every delta > 0 by
    Montgomery-Vaughan 12.1 at y and (1+delta)y. HadamardK holds for the full sum with
    multiplicity, with margin 1.19 (preprint Lemma 2.2). BPTN for T >= 10^13 also follows from
    Trudgian's 2014 bound. HSWN70 and HSWHead14 follow from Hasanalizade-Shen-Wong Corollary
    1.2 for T >= e, with the 7/8 moved into the error. Both-sign counts equal 2 N(T), so they
    are correct. EvenGoldbachUpTo 4*10^18 is the Oliveira e Silva-Herzog-Pardi range. The
    conclusion is nontrivial: it requires a sum of two odd primes in the open interval
    (x, x + 4.45 log^2 x) for every real x >= 3. No human expert and no author of Chirre and
    Hagen's paper has reviewed the entry.

