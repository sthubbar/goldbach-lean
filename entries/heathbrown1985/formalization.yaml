  namespace: "LeanLab"
  statements:
    - source: "Heath-Brown 1985, (1.1), the Siegel-Walfisz theorem"
      lean: "LeanLab.PNTPort.PsiChi.siegelWalfisz"
      module: "ChallengeHeathBrown1985"
      status: "proved"
    - source: "Heath-Brown 1985, Theorem 1"
      lean: "LeanLab.PNTPort.PsiChi.heathBrown_theorem1"
      module: "ChallengeHeathBrown1985"
      status: "proved"
    - source: "Heath-Brown 1985, Corollary 1"
      lean: "LeanLab.PNTPort.PsiChi.heathBrown_corollary1"
      module: "ChallengeHeathBrown1985"
      status: "proved"
    - source: "van der Corput, Chudakov, Estermann 1937-1938, E(X) << X (log X)^{-A}"
      lean: "LeanLab.PNTPort.PsiChi.goldbach_logPowerSaving"
      module: "ChallengeHeathBrown1985"
      status: "proved"
    - source: "Almost all even numbers are sums of two primes, density form"
      lean: "LeanLab.PNTPort.PsiChi.goldbach_densityZero"
      module: "ChallengeHeathBrown1985"
      status: "proved"
    - source: "Heath-Brown 1985, Corollary 2, Vinogradov's three primes theorem"
      lean: "LeanLab.PNTPort.PsiChi.vinogradov_three_primes"
      module: "ChallengeHeathBrown1985"
      status: "proved"
    - source: "Heath-Brown 1985, Corollary 3"
      lean: "LeanLab.PNTPort.PsiChi.three_primes_in_ap"
      module: "ChallengeHeathBrown1985"
      status: "proved"

acknowledgements: "Mathlib and the Lean FRO; the PrimeNumberTheoremAnd contributors; D. R. Heath-Brown for the paper."
