    type: "article"
    location: "Proc. London Math. Soc. 83, 2001, 532-562"
    relationship: "background"
    note: >-
      The source of the exponent 0.525 behind Li's 21/860. It is not an input of this entry; the
      results compared here use Li's 0.52 instead.
    license: "unknown"
    author_endorsement: "not-contacted"

