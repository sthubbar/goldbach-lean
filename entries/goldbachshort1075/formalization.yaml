      is not proved here. The argument adapts Theorem 7.1, the exponent 21/860 from Baker, Harman
      and Pintz 0.525, with Li's 0.52 in place of 0.525. The author has not been contacted about
      this formalization.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "The number of primes in short intervals and numerical calculations for Harman's sieve"
    authors:
