# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Goldbach numbers in short intervals of length x^(26/1075+ε)"
  description: >-
    A Lean 4 proof that for every ε > 0 and all large natural x there is a Goldbach number, an even
    sum of two primes, in the interval from x to x + 3 x^(26/1075+ε). The theorem is conditional on
    two cited results taken as explicit hypotheses, never as axioms, and neither is proved here:
    LiRow052, R. Li, arXiv 2308.04458, Theorem 2, the row θ = 0.52, primes in the intervals from
    n - n^(0.52+ε) to n with a lower bound of the right order, with some positive constant since
    the printed constant differs between versions of the paper; and LiPrintedExceptionalCount,
    R. Li, arXiv 2407.05651 v6, Theorem 1.1, primes in the intervals from n to n + n^(1/21.5+ε) for
    almost all n. The argument adapts Theorem 7.1 of arXiv 2407.05651 v6, page 27, exponent 21/860
    from the 0.525 of Baker, Harman and Pintz. The exponent 26/1075 is lower by 1/4300, and the gain
    is only the replacement of 0.525 by Li's 0.52. Li prints this exponent himself, as Theorem 7 of
    arXiv 2308.04458, with no ε and no factor 3, so this is a formal check of a known result and
    not a new exponent. Li's later note, Primes in almost all short intervals II, claims 1/22+ε in
    place of 1/21.5+ε, so 26/1075 is not claimed as the best exponent. Both cited papers are used here
    in their arXiv preprint form. Proved with no cited input: the passage from a count of primes in the
    intervals below n to a count in the windows from x - 2Y to x - Y, and the combinatorial step
    from the two counts to a Goldbach number. Binary Goldbach is open and is not claimed. AI agents
    wrote the Lean code, Claude, Codex and Gemini, as listed in PORTING.md, and it is offered for
    human audit.
  authors:
    - "Steve Hubbard"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Steve Hubbard"

classification:
  arxiv: ["math.NT"]
  msc2020: ["11P32", "11N05"]

