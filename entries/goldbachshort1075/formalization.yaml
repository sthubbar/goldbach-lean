    id: "arXiv:2308.04458"
    type: "preprint"
    location: "arXiv 2308.04458 v8: Theorem 2, page 2, the row 0.520, and Theorem 7, page 35"
    relationship: "adapts"
    note: >-
      Theorem 2, the row 0.520, is a cited input, taken as the explicit hypothesis LiRow052 with
      some positive constant; it is not proved here. Theorem 7 prints the exponent 26/1075, with no
      ε and no factor 3, and the entry proves that slightly weaker form. The printed LB(0.520) is
      0.0300 in versions 6 and 7 and 0.004 in version 8. The author has not been contacted about
      this formalization.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "The difference between consecutive primes, II"
    authors:
