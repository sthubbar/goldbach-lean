    with no ε.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: ["Claude Opus 5.5 (claude-opus-5-5), Anthropic", "Codex, OpenAI", "Gemini, Google"]
      framework: "Claude Cowork"
      tool_setup: >-
        Autonomous agents wrote the Lean files, ran lake build and read the papers; PORTING.md lists
        which agent wrote each file. A packaging agent trimmed the files, ported them to Lean 4
        v4.35.0-rc3, Mathlib v4.35.0-rc3, and ran the Lean kernel and the Comparator.
      cost:
        wall_time: "agent runs over 2026-10-16 to 2026-11-02, and packaging on 2026-11-03"
        spend_usd: "subscription-based"
        hardware: "API-only, cloud sandbox and a desktop workstation"
      prompting_notes: >-
        The agents ran under a standing research brief to formalize published results related to
        Goldbach's problem and the inputs they cite, recording every cited input until proved.
  spend_usd: "subscription-based"
  notes: >-
    Steve Hubbard directed the project and decided what to publish; AI agents wrote all Lean code
    and the statements. No human expert has reviewed the mathematics.

fidelity:
  divergences: >-
    The theorem is conditional. Cited inputs, explicit hypotheses and never axioms: LiRow052, R. Li,
    arXiv 2308.04458, Theorem 2, the row θ = 0.52; and LiPrintedExceptionalCount, R. Li, arXiv
    2407.05651 v6, Theorem 1.1. Main statement: Theorem 7.1 of arXiv 2407.05651 v6 and Theorem 7 of
    arXiv 2308.04458 print intervals of length x^(21/860) and x^(26/1075), with no ε and no constant
    factor. The entry has the factor 3 and ε > 0, which is what follows from the two theorems as
    printed, so it is slightly weaker than Theorem 7. A smaller ε absorbs the factor 3. Li's remark
    that ε can be dropped, since Theorem 1 of arXiv 2308.04458 extends to a slightly smaller θ, is
    not used. The variable x is a natural number. A Goldbach number is an even sum of two primes,
    IsGoldbachNumber, while Li writes sum of two primes. LiRow052: the printed LB(0.520) is 0.0300
    in versions 6 and 7 of arXiv 2308.04458 and 0.004 in version 8, so the hypothesis asks only for
    some c > 0 that does not depend on ε. It covers 0 < ε ≤ 0.005 and all large natural n, and the
    paper's standing assumption is that x is a large integer. It counts the primes p with
    n - n^(0.52+ε) < p ≤ n, as π(x) - π(x - x^(θ+ε)) does, with a strict inequality that holds on
    taking c a little below LB. LiPrintedExceptionalCount: Theorem 1.1 says that for n in [X, 2X],
    outside O(X (log X)^(-B)) values, the interval from n to n + n^(1/21.5+ε) holds at least the
    expected order of primes. The hypothesis uses B = 3 and only that the interval has a prime, and
    it is stated for every η > 0, since Li's sufficiently small ε extends to all larger exponents
    by monotonicity; so it is implied by the printed theorem. Binary Goldbach is open. The Lean code
    was written by AI.

review:
  status: "self-assessed"
  reviewers:
    - "AI packaging agent: an instance of Claude Opus 5.5, claude-opus-5-5, Anthropic; not a human reviewer"
  notes: >-
    Status is self-assessed: every check was done by AI agents of the families that wrote the Lean
    code, so it is not an independent review and not a human expert review. The packaging agent
    read Theorems 1.1 and 7.1 of arXiv 2407.05651 v6 and Theorems 2 and 7 of arXiv 2308.04458 in
    text copies, built the entry, and ran the Lean kernel and the Comparator with only propext,
    Quot.sound and Classical.choice permitted. Both hypotheses are consequences of Li's printed
    theorems, so the main theorem is not vacuous if those stand; both papers are preprints, and the
    change in LB(0.520) between versions is a reason to read them with care. No human expert and
    not the papers' author has reviewed the entry.

alignment:
  namespace: "LeanLab"
  statements:
    - source: "R. Li, arXiv 2308.04458, Theorem 7, and arXiv 2407.05651 v6, Theorem 7.1 at the exponent 0.52: Goldbach numbers in intervals of length x^(26/1075)"
      lean: "LeanLab.GoldbachShort78.goldbach_short_1075"
      module: "ChallengeGoldbachShort1075"
      status: "adapted"
      note: "With ε > 0 and a factor 3, conditional on LiRow052 and LiPrintedExceptionalCount, explicit hypotheses."
    - source: "Derived step, not printed in the papers: a count of primes below n gives the count in the windows from x - 2Y to x - Y"
      lean: "LeanLab.GoldbachShort78.windowCount_of_backward"
      module: "ChallengeGoldbachShort1075"
      status: "proved"
    - source: "Derived step, not printed in the papers: the combinatorial passage from the two counts to a Goldbach number"
      lean: "LeanLab.GoldbachShort78.goldbach_of_counts"
      module: "ChallengeGoldbachShort1075"
      status: "proved"
    - source: "The exponent arithmetic: 0.52 / 21.5 = 26/1075, lower than 21/860 by 1/4300"
      lean: "LeanLab.GoldbachShort78.exponent_1075"
      module: "ChallengeGoldbachShort1075"
      status: "proved"

