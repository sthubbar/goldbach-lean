name: Palomar preflight

on:
  workflow_dispatch:
    inputs:
      project_path:
        description: "Lake project of the entry"
        required: true
        default: "entries/heathbrown1985"
      comparator_config_path:
        description: "Comparator config, relative to the project"
        required: true
        default: "comparator-heathbrown1985.json"

permissions:
  contents: read

jobs:
  palomar-preflight:
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
    with:
      repository: ${{ github.repository }}
      commit: ${{ github.sha }}
      pipeline_commit: d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
      request_id: preflight002
      mode: full
      execution_profile: palomar-standard-v1
      options: '{"project_path":"${{ inputs.project_path }}","comparator_config_path":"${{ inputs.comparator_config_path }}","authorization_relationship":"I am a responsible author or maintainer"}'
